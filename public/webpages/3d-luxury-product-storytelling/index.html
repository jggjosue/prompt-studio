<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Luxury Product Storytelling</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <video id="story-video" class="hidden-media" preload="metadata" crossorigin="anonymous">
    <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" type="video/mp4">
    <track kind="captions" srclang="en" label="English" src="assets/subtitles-en.vtt" default>
  </video>

  <div id="scene-root"></div>

  <main class="ui-layer" aria-label="Luxury product story controls">
    <header class="topbar glass">
      <div>
        <p class="eyebrow">Maison Lumiere</p>
        <h1>Noir Edition Story Chamber</h1>
      </div>
      <button id="play-story" class="btn btn-primary">Play Story</button>
    </header>

    <section class="story-panel glass" aria-label="Story chapters and notes">
      <h2>Story Chapters</h2>
      <div id="chapters" class="chapters"></div>
      <label for="story-scrub" class="small-label">Story Timeline</label>
      <input id="story-scrub" type="range" min="0" max="100" value="0" step="0.1">
      <p id="subtitle" class="subtitle">Activate Story to begin the visual narrative.</p>
    </section>

    <section class="notes-panel glass" aria-label="Technical notes">
      <h2>Technical Notes</h2>
      <ul id="tech-notes"></ul>
    </section>

    <section class="fallback-panel glass" aria-label="Accessible fallback with video and transcript">
      <h2>2D Fallback</h2>
      <div class="fallback-actions">
        <button id="toggle-fallback" class="btn">Show 2D Story</button>
      </div>
      <div id="fallback-view" class="fallback-view hidden">
        <video controls crossorigin="anonymous" poster="https://images.unsplash.com/photo-1503341455253-b2e723bb3dbb?auto=format&fit=crop&w=1200&q=70">
          <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" type="video/mp4">
          <track kind="captions" srclang="en" label="English" src="assets/subtitles-en.vtt" default>
        </video>
        <article id="transcript" class="transcript"></article>
      </div>
    </section>
  </main>

  <script type="module" src="luxury.js"></script>
</body>
</html>
