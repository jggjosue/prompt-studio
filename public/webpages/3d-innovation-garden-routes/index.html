<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jardín de Innovación 3D — Proyectos y Rutas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo"><span class="logo-icon">◈</span><span>Innovación 3D</span></div>
      <nav class="route-nav" id="route-nav">
        <button class="route-btn active" data-route="all">🌳 Todas</button>
        <button class="route-btn" data-route="0">🤖 IA</button>
        <button class="route-btn" data-route="1">🌱 Sostenibilidad</button>
        <button class="route-btn" data-route="2">❤️ Salud</button>
      </nav>
      <div class="topbar-actions">
        <button id="tour-btn" class="btn btn-sm btn-outline" title="Tour automático">🎬 Tour</button>
        <button id="curator-btn" class="btn btn-sm btn-outline" title="Playlist curadora">📋</button>
        <button id="fallback-btn" class="btn btn-sm btn-outline">♿</button>
      </div>
    </header>

    <div id="main">
      <div id="scene-root" role="img" aria-label="Jardín 3D de innovación con parcelas temáticas"></div>

      <div id="project-panel" class="hidden">
        <button id="project-close" class="panel-close">&times;</button>
        <div class="project-inner">
          <h3 id="project-title" class="project-title"></h3>
          <div class="video-wrapper">
            <video id="project-video" controls preload="metadata" crossorigin="anonymous"></video>
          </div>
          <p id="project-desc" class="project-desc"></p>
          <div id="project-meta" class="project-meta"></div>
          <a id="project-link" class="project-link" target="_blank" rel="noopener">🔗 Recurso externo</a>
        </div>
      </div>

      <div id="curator-panel" class="hidden">
        <div class="curator-header">
          <h3>📋 Playlist curadora</h3>
          <button id="curator-export" class="btn btn-sm btn-outline">📄 Exportar PDF</button>
          <button id="curator-close" class="btn btn-sm btn-outline">×</button>
        </div>
        <div id="curator-items" class="curator-items"></div>
      </div>
    </div>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <button id="modal-close" class="modal-close">&times;</button>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>

    <div id="fallback-section" class="hidden" aria-live="polite">
      <div class="fallback-inner"><h2>🌳 Jardín de Innovación — Versión 2D</h2><div id="fb-grid" class="fb-grid"></div></div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="innovationGarden.js"></script>
</body>
</html>
