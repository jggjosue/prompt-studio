<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Congreso Científico 3D — Pósters y Presentaciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo"><span class="logo-star">✦</span><span>Congreso 3D</span></div>
      <div class="topbar-actions">
        <div class="filter-group" id="filter-topic">
          <button class="btn btn-sm btn-filter active" data-topic="all">Todo</button>
          <button class="btn btn-sm btn-filter" data-topic="biologia">🧬 Biología</button>
          <button class="btn btn-sm btn-filter" data-topic="fisica">⚛️ Física</button>
          <button class="btn btn-sm btn-filter" data-topic="medicina">💊 Medicina</button>
        </div>
        <button id="tour-btn" class="btn btn-sm btn-outline">🚶 Recorrido</button>
        <button id="favorites-btn" class="btn btn-sm btn-outline">⭐ Favoritos</button>
        <button id="qa-btn" class="btn btn-sm btn-outline">💬 Q&A</button>
        <button id="metrics-btn" class="btn btn-sm btn-outline">📊</button>
      </div>
    </header>

    <div id="main">
      <div id="scene-root" role="img" aria-label="Sala de pósters científicos 3D"></div>

      <!-- Poster overlay -->
      <div id="poster-overlay" class="hidden overlay" role="dialog" aria-label="Póster">
        <div class="overlay-box poster-box">
          <div class="poster-layout">
            <div class="poster-video-wrap">
              <video id="poster-video" controls preload="metadata" playsinline></video>
            </div>
            <div class="poster-info-wrap">
              <div id="poster-info" class="poster-info"></div>
              <div id="poster-abstract" class="poster-abstract"></div>
              <div id="poster-pdf" class="poster-pdf"><button id="pdf-open" class="btn btn-sm btn-outline">📄 Ver PDF</button></div>
              <div class="poster-actions">
                <button id="poster-fav" class="btn btn-sm btn-outline">⭐ Favorito</button>
                <button id="poster-qa" class="btn btn-sm btn-outline">💬 Preguntar</button>
                <button id="poster-close" class="btn btn-sm btn-outline">Cerrar</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Favorites panel -->
      <div id="favorites-panel" class="hidden panel-left" role="dialog" aria-label="Favoritos">
        <div class="panel-header"><h4>⭐ Favoritos</h4><button id="favorites-close" class="btn btn-sm btn-outline">×</button></div>
        <div id="favorites-body" class="favorites-body"></div>
        <button id="csv-export" class="btn btn-outline btn-sm" style="width:100%;margin-top:.1rem">📥 Exportar CSV</button>
      </div>

      <!-- Q&A panel -->
      <div id="qa-panel" class="hidden panel-right" role="dialog" aria-label="Preguntas">
        <div class="panel-header"><h4>💬 Preguntas</h4><button id="qa-close" class="btn btn-sm btn-outline">×</button></div>
        <div id="qa-questions" class="qa-questions"></div>
        <textarea id="qa-input" placeholder="Tu pregunta (se ancla al timestamp)" aria-label="Pregunta"></textarea>
        <button id="qa-send" class="btn btn-primary" style="width:100%;margin-top:.1rem">Enviar</button>
      </div>

      <!-- Metrics panel -->
      <div id="metrics-panel" class="hidden panel-left" role="dialog" aria-label="Métricas">
        <div class="panel-header"><h4>📊 Métricas</h4><button id="metrics-close" class="btn btn-sm btn-outline">×</button></div>
        <div id="metrics-body" class="metrics-body"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
  <script src="congress3d.js"></script>
</body>
</html>
