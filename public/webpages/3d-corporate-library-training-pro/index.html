<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capacitación Pro — Biblioteca 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo"><span class="logo-icon">◈</span><span>Capacitación Pro</span></div>
      <div class="search-filters">
        <input type="text" id="search-input" placeholder="Búsqueda semántica..." aria-label="Buscar">
        <select id="dept-filter" aria-label="Departamento"><option value="all">Todos</option><option value="IT">IT</option><option value="RH">RH</option><option value="Finanzas">Finanzas</option><option value="Marketing">Marketing</option></select>
        <select id="level-filter" aria-label="Nivel"><option value="all">Todos</option><option value="basic">Básico</option><option value="intermediate">Intermedio</option><option value="advanced">Avanzado</option></select>
        <select id="duration-filter" aria-label="Duración"><option value="all">Cualquier duración</option><option value="short">&lt; 8 min</option><option value="medium">8–12 min</option><option value="long">&gt; 12 min</option></select>
      </div>
      <div class="topbar-actions">
        <button id="playlist-btn" class="btn btn-sm btn-outline" title="Playlists">📋</button>
        <button id="export-notes-btn" class="btn btn-sm btn-outline" title="Exportar notas">📤</button>
        <button id="fallback-btn" class="btn btn-sm btn-outline" title="Modo 2D">♿</button>
      </div>
    </header>

    <div id="main">
      <div id="scene-root" role="img" aria-label="Biblioteca corporativa 3D con estanterías por departamento"></div>

      <div id="clip-panel" class="hidden">
        <button id="clip-close" class="panel-close">&times;</button>
        <div class="clip-inner">
          <h3 id="clip-title" class="clip-title"></h3>
          <div class="video-wrapper">
            <video id="clip-video" controls preload="metadata" crossorigin="anonymous"></video>
            <div id="scrubber-proxy" class="scrubber-proxy hidden"><canvas id="proxy-canvas"></canvas><span id="proxy-time">0:00</span></div>
          </div>
          <div id="clip-meta" class="clip-meta"></div>
          <div class="playlist-actions">
            <button id="add-to-playlist-btn" class="btn btn-xs">➕ Lista</button>
            <button id="mark-complete-btn" class="btn btn-xs">✔ Completar</button>
          </div>
          <div class="notes-area">
            <h4>📝 Notas <span id="notes-count" class="notes-count"></span></h4>
            <div class="notes-timeline" id="notes-timeline"></div>
            <div class="notes-input-row">
              <input type="text" id="notes-input" placeholder="Nota en este timestamp..." style="flex:1">
              <button id="notes-add-btn" class="btn btn-sm">➕</button>
            </div>
          </div>
          <div id="clip-transcript" class="clip-transcript">
            <details><summary>📄 Transcripción</summary><div id="transcript-body" class="transcript-body"></div></details>
          </div>
        </div>
      </div>

      <div id="playlist-panel" class="hidden">
        <button id="playlist-close" class="panel-close">&times;</button>
        <div class="playlist-inner">
          <h3>📋 Mis Playlists</h3>
          <div id="playlist-list" class="playlist-list"></div>
        </div>
      </div>

      <div id="stats-bar" class="stats-bar hidden">
        <span id="stat-completion"></span>
        <span id="stat-avg-time"></span>
        <span id="stat-top-notes"></span>
      </div>
    </div>

    <div id="modal" class="modal hidden"><div class="modal-content"><button id="modal-close" class="modal-close">&times;</button><div id="modal-body" class="modal-body"></div></div></div>
    <div id="fallback-section" class="hidden" aria-live="polite"><div class="fallback-inner"><h2>📚 Capacitación — Modo 2D</h2><div id="fb-grid" class="fb-grid"></div></div></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="corpLibraryPro.js"></script>
</body>
</html>
