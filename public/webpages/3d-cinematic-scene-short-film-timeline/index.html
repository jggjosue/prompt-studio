<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinematic 3D Timeline Scene</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <video id="film-video" preload="metadata" playsinline crossorigin="anonymous">
    <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" type="video/mp4">
  </video>

  <div id="scene-root"></div>

  <main class="ui">
    <header class="top glass">
      <div>
        <p class="eyebrow">Audiovisual Narrative Engine</p>
        <h1>Cinematic Short Film Scene</h1>
      </div>
      <div class="actions">
        <button id="play-toggle" class="btn">Play</button>
        <button id="mode-toggle" class="btn">Modo Explorador</button>
        <button id="fallback-toggle" class="btn">Fallback 2D</button>
      </div>
    </header>

    <section class="timeline glass">
      <h2>Timeline Chapters</h2>
      <div id="chapters" class="chapters"></div>
      <input id="scrubber" type="range" min="0" max="100" value="0" step="0.1" aria-label="Scrub timeline">
      <p id="subtitle" class="subtitle">Ready. Use Play or scrub to control video and scene cues.</p>
    </section>

    <section id="fallback" class="fallback glass hidden"></section>
  </main>

  <script type="module" src="cinema.js"></script>
</body>
</html>
