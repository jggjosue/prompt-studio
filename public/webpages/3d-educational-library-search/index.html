<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca 3D — Clips Educativos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo"><span class="logo-icon">◈</span><span>Biblioteca 3D</span></div>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Buscar clips educativos..." aria-label="Búsqueda semántica">
        <button id="search-btn" class="btn btn-sm" aria-label="Buscar">🔍</button>
      </div>
      <div class="topbar-actions">
        <button id="playlist-btn" class="btn btn-sm btn-outline" title="Playlist">📋</button>
        <button id="fallback-btn" class="btn btn-sm btn-outline">♿</button>
      </div>
    </header>

    <div id="main">
      <div id="scene-root" role="img" aria-label="Biblioteca 3D con estanterías y clips educativos"></div>

      <aside id="playlist-panel" class="hidden">
        <div class="playlist-header">
          <h3>📋 Playlist</h3>
          <button id="playlist-clear" class="btn btn-sm btn-outline">Vaciar</button>
        </div>
        <div id="playlist-items" class="playlist-items"></div>
      </aside>

      <div id="clip-panel" class="hidden">
        <button id="clip-close" class="panel-close">&times;</button>
        <div class="clip-inner">
          <h3 id="clip-title" class="clip-title"></h3>
          <div class="video-wrapper">
            <video id="clip-video" controls preload="metadata" crossorigin="anonymous"></video>
          </div>
          <div id="clip-meta" class="clip-meta"></div>
          <div id="clip-transcript" class="clip-transcript">
            <details>
              <summary>📄 Transcripción</summary>
              <div id="transcript-body" class="transcript-body"></div>
            </details>
          </div>
          <div class="clip-actions">
            <button id="clip-playlist-btn" class="btn btn-sm btn-outline">➕ Agregar a playlist</button>
            <button id="clip-review-btn" class="btn btn-sm btn-outline">🔖 Marcar</button>
          </div>
        </div>
      </div>
    </div>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <button id="modal-close" class="modal-close">&times;</button>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>

    <div id="fallback-section" class="hidden" aria-live="polite">
      <div class="fallback-inner">
        <h2>📚 Biblioteca 3D — Versión 2D</h2>
        <div id="fb-grid" class="fb-grid"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="library3d.js"></script>
</body>
</html>
