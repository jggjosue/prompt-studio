<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conferencia 3D — Escenario Principal y Salas Paralelas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo"><span class="logo-star">✦</span><span>Conf 3D</span></div>
      <div class="topbar-actions">
        <button id="agenda-btn" class="btn btn-sm btn-outline">📋 Agenda</button>
        <button id="angles-btn" class="btn btn-sm btn-outline">🎥 Ángulos</button>
        <button id="highlights-btn" class="btn btn-sm btn-outline">⭐ Clips</button>
        <button id="qa-btn" class="btn btn-sm btn-outline">💬 Q&A</button>
        <button id="metrics-btn" class="btn btn-sm btn-outline">📊</button>
        <button id="lobby-btn" class="btn btn-sm btn-outline">🏛 Lobby</button>
      </div>
    </header>

    <div id="main">
      <div id="scene-root" role="img" aria-label="Conferencia 3D con escenario y salas paralelas"></div>

      <!-- Agenda overlay -->
      <div id="agenda-overlay" class="overlay" role="dialog" aria-label="Agenda de la conferencia">
        <div class="overlay-box">
          <h2>📋 Agenda</h2>
          <div id="agenda-list" class="agenda-list"></div>
          <button id="agenda-close-btn" class="btn btn-primary" style="width:100%;margin-top:.4rem">Comenzar</button>
        </div>
      </div>

      <!-- Angle selector -->
      <div id="angles-panel" class="hidden panel-left" role="dialog" aria-label="Selector de ángulo">
        <div class="panel-header"><h4>🎥 Ángulos</h4><button id="angles-close" class="btn btn-sm btn-outline">×</button></div>
        <div id="angles-body" class="angles-body"></div>
      </div>

      <!-- Highlights sidebar -->
      <div id="highlights-panel" class="hidden panel-right" role="dialog" aria-label="Clips destacados">
        <div class="panel-header"><h4>⭐ Clips destacados</h4><button id="highlights-close" class="btn btn-sm btn-outline">×</button></div>
        <div id="highlights-body" class="highlights-body"></div>
      </div>

      <!-- Q&A panel -->
      <div id="qa-panel" class="hidden panel-right" role="dialog" aria-label="Preguntas en vivo">
        <div class="panel-header"><h4>💬 Preguntas</h4><button id="qa-close" class="btn btn-sm btn-outline">×</button></div>
        <div id="qa-body" class="qa-body">
          <div id="qa-list" class="qa-list"></div>
          <textarea id="qa-input" placeholder="Escribe tu pregunta…" aria-label="Tu pregunta"></textarea>
          <button id="qa-send" class="btn btn-primary" style="width:100%;margin-top:.15rem">Enviar</button>
        </div>
      </div>

      <!-- Metrics panel -->
      <div id="metrics-panel" class="hidden panel-left" role="dialog" aria-label="Métricas">
        <div class="panel-header"><h4>📊 Métricas</h4><button id="metrics-close" class="btn btn-sm btn-outline">×</button></div>
        <div id="metrics-body" class="metrics-body"></div>
      </div>

      <!-- Replay modal -->
      <div id="replay-modal" class="hidden overlay" role="dialog" aria-label="Replay de segmento">
        <div class="overlay-box replay-box">
          <h3>🔄 Replay</h3>
          <video id="replay-video" controls preload="metadata" playsinline style="width:100%;border-radius:6px"></video>
          <p id="replay-info" style="font-size:.5rem;color:var(--muted);margin-top:.15rem"></p>
          <button id="replay-close" class="btn btn-primary" style="width:100%;margin-top:.3rem">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="conference3d.js"></script>
</body>
</html>
