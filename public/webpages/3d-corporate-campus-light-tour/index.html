<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corporate Campus 3D Light Tour — Explanatory Videos</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="scene-root"></div>

  <button id="start-tour-btn" class="start-btn">Iniciar tour</button>

  <main class="ui">
    <header class="top light-card">
      <div>
        <p class="eyebrow">Corporate Campus</p>
        <h1>Light Mode 3D Tour</h1>
      </div>
      <div class="actions">
        <button id="auto-tour" class="btn btn-outline">🎧 Tour automático</button>
        <button id="toggle-view" class="btn btn-outline">🎬 Textura 3D</button>
        <button id="fallback-btn" class="btn btn-outline">Fallback 2D</button>
      </div>
    </header>

    <section class="panel light-card">
      <h2>Zonas del campus</h2>
      <div class="row">
        <button class="btn zone-btn" data-zone="0">1 Lobby</button>
        <button class="btn zone-btn" data-zone="1">2 Auditorio</button>
        <button class="btn zone-btn" data-zone="2">3 Lab</button>
        <button class="btn zone-btn" data-zone="3">4 Terraza</button>
        <button class="btn zone-btn" data-zone="4">5 Cafetería</button>
      </div>
      <p id="zone-copy" class="copy">Selecciona una zona o haz clic en un hotspot 3D para ver el video explicativo con subtítulos y métricas.</p>
      <div id="metrics-display" class="metrics-display"></div>
    </section>

    <section id="fallback-section" class="fallback light-card hidden" aria-label="2D fallback with hero video"></section>
  </main>

  <div id="video-panel" class="video-panel hidden" role="dialog" aria-modal="true" aria-label="Explanatory video">
    <div class="video-card">
      <button id="close-panel" class="btn btn-close">✕</button>
      <h3 id="panel-title"></h3>
      <video id="panel-video" controls preload="metadata" crossorigin="anonymous">
        <track kind="captions" srclang="en" label="English" src="assets/subtitles-en.srt" default>
      </video>
      <p id="panel-subtitle" class="panel-subtitle"></p>
      <div class="panel-links">
        <a class="link-download" href="assets/transcript.txt" download>📝 Descargar transcripción</a>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
