<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feria Comercial 3D — Pabellones y Videos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo"><span class="logo-star">✦</span><span>Trade Fair 3D</span></div>
      <div class="topbar-actions">
        <button id="map-toggle" class="btn btn-sm btn-outline">🗺 Mapa</button>
        <button id="tour-toggle" class="btn btn-sm btn-outline">🚀 Tour guiado</button>
        <button id="reset-cam" class="btn btn-sm btn-outline">⟲ Atrio</button>
        <button id="analytics-btn" class="btn btn-sm btn-outline">📊</button>
        <button id="access-btn" class="btn btn-sm btn-outline">♿</button>
      </div>
    </header>

    <div id="main">
      <div id="scene-root" role="img" aria-label="Feria comercial 3D con pabellones y stands"></div>

      <!-- Floating map overlay -->
      <div id="map-panel" class="hidden" role="dialog" aria-label="Mapa de la feria">
        <div class="map-header"><h3>🗺 Pabellones</h3><button id="map-close" class="btn btn-sm btn-outline">×</button></div>
        <div id="map-body" class="map-body"></div>
      </div>

      <!-- Stand panel overlay -->
      <div id="stand-panel" class="hidden" role="dialog" aria-label="Panel del stand">
        <button id="stand-panel-close" class="panel-close">&times;</button>
        <div class="stand-panel-inner">
          <div class="stand-video-wrap">
            <video id="stand-video" controls preload="metadata" playsinline></video>
          </div>
          <div id="stand-info" class="stand-info"></div>
          <div id="stand-srt" class="stand-srt"></div>
          <div class="stand-actions">
            <button id="demo-btn" class="btn btn-sm btn-outline">▶ Demo extendida</button>
            <button id="meeting-btn" class="btn btn-sm btn-outline">🤝 Solicitar reunión</button>
          </div>
        </div>
      </div>

      <!-- Meeting confirmation -->
      <div id="meeting-toast" class="hidden toast" role="status">✅ Solicitud enviada</div>

      <!-- Analytics panel -->
      <div id="analytics-panel" class="hidden" role="dialog" aria-label="Analítica">
        <div class="analytics-header"><h3>📊 Actividad</h3><button id="analytics-close" class="btn btn-sm btn-outline">×</button></div>
        <div id="analytics-body" class="analytics-body"></div>
      </div>
    </div>

    <div id="fallback-section" class="hidden">
      <div class="fallback-inner">
        <h2>✦ Versión 2D</h2>
        <div id="fb-stands" class="fb-stands"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="fair3d.js"></script>
</body>
</html>
