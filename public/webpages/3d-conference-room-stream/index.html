<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sala 3D — Streaming y Clips</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo"><span class="logo-icon">◈</span><span>Conferencia 3D</span></div>
      <div id="reactions" class="reactions">
        <button class="reaction-btn" data-icon="👍">👍</button>
        <button class="reaction-btn" data-icon="👏">👏</button>
        <button class="reaction-btn" data-icon="🔥">🔥</button>
        <button class="reaction-btn" data-icon="❤️">❤️</button>
      </div>
      <div class="topbar-actions">
        <button id="stream2d-btn" class="btn btn-sm btn-outline" title="Ver solo stream 2D">📺</button>
        <button id="fallback-btn" class="btn btn-sm btn-outline" title="Fallback 2D">♿</button>
      </div>
    </header>

    <div id="main">
      <div id="scene-root" role="img" aria-label="Sala de conferencias 3D light mode"></div>

      <div id="camera-controls" class="camera-controls">
        <button class="cam-btn active" data-angle="stage">🎤 Escenario</button>
        <button class="cam-btn" data-angle="audience">👥 Público</button>
        <button class="cam-btn" data-angle="side">📐 Lateral</button>
      </div>

      <aside id="clips-panel">
        <h3 class="clips-title">🎬 Clips destacados</h3>
        <div id="clips-list" class="clips-list"></div>
      </aside>

      <div id="hls-overlay" class="hidden">
        <video id="hls-video" controls crossorigin="anonymous"></video>
        <button id="hls-close" class="panel-close">&times;</button>
      </div>
    </div>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <button id="modal-close" class="modal-close">&times;</button>
        <video id="modal-video" controls preload="metadata" crossorigin="anonymous"></video>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>

    <div id="fallback-section" class="hidden" aria-live="polite">
      <div class="fallback-inner">
        <h2>🎤 Sala de Conferencias — Versión 2D</h2>
        <div id="fb-grid" class="fb-grid"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="conference3d.js"></script>
</body>
</html>
