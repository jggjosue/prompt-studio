<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motion 3D — Showreel con Stems</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo"><span class="logo-play">▶</span><span>Motion 3D</span></div>
      <div class="topbar-actions">
        <button id="deconstruct-btn" class="btn btn-sm btn-outline">🔧 Deconstruir</button>
        <button id="analytics-btn" class="btn btn-sm btn-outline" title="Analytics">📊</button>
        <button id="fallback-btn" class="btn btn-sm btn-outline">♿</button>
      </div>
    </header>

    <div id="main">
      <div id="scene-root" role="img" aria-label="Escena 3D con paneles de showreel y visualizadores de audio"></div>

      <div id="reel-panel" class="hidden">
        <button id="reel-close" class="panel-close">&times;</button>
        <div class="reel-inner">
          <div class="reel-video-wrap">
            <video id="reel-video" controls preload="metadata" crossorigin="anonymous" playsinline></video>
            <div class="reel-markers" id="reel-markers"></div>
          </div>
          <div class="reel-stems" id="reel-stems">
            <div class="stem-row"><span>🎵 Música</span><input type="range" class="stem-slider" data-stem="music" min="0" max="100" value="80"></div>
            <div class="stem-row"><span>💥 SFX</span><input type="range" class="stem-slider" data-stem="sfx" min="0" max="100" value="80"></div>
            <div class="stem-row"><span>🎤 Voz</span><input type="range" class="stem-slider" data-stem="voice" min="0" max="100" value="80"></div>
          </div>
          <div class="reel-effects">
            <div class="fx-row"><span>🌊 Reverb</span><input type="range" class="fx-slider" data-fx="reverb" min="0" max="100" value="20"></div>
            <div class="fx-row"><span>⏳ Delay</span><input type="range" class="fx-slider" data-fx="delay" min="0" max="100" value="10"></div>
          </div>
          <div id="reel-meta" class="reel-meta"></div>
        </div>
      </div>

      <div id="deconstruct-panel" class="hidden">
        <div class="decon-header">
          <h3>🔧 Deconstruir</h3>
          <button id="decon-close" class="btn btn-sm btn-outline">×</button>
        </div>
        <div id="decon-body"></div>
      </div>

      <div id="analytics-panel" class="hidden">
        <div class="analytics-header">
          <h3>📊 Analytics</h3>
          <button id="analytics-close" class="btn btn-sm btn-outline">×</button>
        </div>
        <div id="analytics-body"></div>
      </div>
    </div>

    <div id="fallback-section" class="hidden" aria-live="polite">
      <div class="fallback-inner">
        <h2>▶ Versión 2D</h2>
        <div id="fb-reels" class="fb-reels"></div>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="motion3d.js"></script>
</body>
</html>
