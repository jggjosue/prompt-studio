<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Library Semantic Search</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="scene-root"></div>

  <main class="ui">
    <header class="top glass">
      <div>
        <p class="eyebrow">Editorial Semantic Library</p>
        <h1>3D Educational Clip Vault</h1>
      </div>
      <div class="actions">
        <button id="toggle-nav" class="btn">Orbit Mode</button>
        <button id="toggle-fallback" class="btn">2D Fallback</button>
      </div>
    </header>

    <aside class="panel glass">
      <h2>Semantic Search</h2>
      <input id="search" type="search" placeholder="Search by topic, level or duration..." aria-label="Semantic search">
      <div id="results" class="results"></div>
      <h3>Favorites Playlist</h3>
      <ul id="favorites" class="favorites"></ul>
    </aside>

    <section id="player" class="player glass hidden" role="dialog" aria-modal="true" aria-label="Educational clip panel">
      <button id="close-player" class="btn close">Close</button>
      <h3 id="clip-title"></h3>
      <video id="clip-video" controls playsinline preload="metadata" crossorigin="anonymous"></video>
      <p id="clip-subtitle" class="subtitle"></p>
      <article id="clip-transcript" class="transcript"></article>
      <div class="meta-row">
        <button id="fav-btn" class="btn">Add to favorites</button>
        <a href="assets/transcript.txt" download>Download transcript</a>
      </div>
    </section>

    <section id="fallback" class="fallback glass hidden"></section>
  </main>

  <script type="module" src="library.js"></script>
</body>
</html>
