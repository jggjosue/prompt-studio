<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Showroom 3D — Demos y Hotspots</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo"><span class="logo-icon">◆</span><span>Tech Showroom Pro</span></div>
      <div class="topbar-actions">
        <button id="deep-dive-btn" class="btn btn-sm btn-outline" title="Deep Dive">🔬 Deep Dive</button>
        <button id="share-btn" class="btn btn-sm btn-outline" title="Compartir">🔗</button>
        <button id="fallback-btn" class="btn btn-sm btn-outline">♿</button>
      </div>
    </header>

    <div id="main">
      <div id="scene-root" role="img" aria-label="Showroom 3D con producto tecnológico en pedestal"></div>

      <div id="hotspot-panel" class="hidden">
        <button id="panel-close" class="panel-close">&times;</button>
        <div class="panel-inner">
          <h3 id="panel-title" class="panel-title"></h3>
          <div class="video-wrapper">
            <video id="panel-video" controls preload="metadata" crossorigin="anonymous"></video>
          </div>
          <div id="snippet-area" class="snippet-area">
            <div class="snippet-header">
              <span class="snippet-lang" id="snippet-lang">JS</span>
              <div class="snippet-actions">
                <button id="snippet-copy" class="btn btn-xs">📋 Copiar</button>
                <button id="snippet-sandbox" class="btn btn-xs">🚀 Sandbox</button>
              </div>
            </div>
            <pre id="snippet-code" class="snippet-pre"><code class="language-javascript"></code></pre>
          </div>
          <p id="panel-desc" class="panel-desc"></p>
        </div>
      </div>

      <div id="deep-dive-overlay" class="hidden deep-dive-overlay">
        <div class="dd-content">
          <button id="dd-close" class="panel-close">&times;</button>
          <h3>🔬 Deep Dive: Internals</h3>
          <div id="dd-body" class="dd-body"></div>
        </div>
      </div>
    </div>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <button id="modal-close" class="modal-close">&times;</button>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>

    <div id="fallback-section" class="hidden" aria-live="polite">
      <div class="fallback-inner"><h2>💻 Tech Showroom — Versión 2D</h2><div id="fb-grid" class="fb-grid"></div></div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
  <script src="techshowPro.js"></script>
</body>
</html>
