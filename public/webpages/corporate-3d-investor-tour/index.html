<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nexus Corp — 3D Investor Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06090f;--surf:#0d1525;--surf2:#152040;--bdr:#1e3060;
  --txt:#dde8f5;--muted:#5a7090;
  --blue:#4f9cf9;--green:#34d399;--amber:#f59e0b;
  --ff:'Inter',system-ui,sans-serif;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--ff);-webkit-font-smoothing:antialiased}
#c{position:fixed;top:0;left:0;display:block;width:100%;height:100%}

/* NAV */
#nav{position:fixed;top:0;left:0;right:0;height:58px;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(6,9,15,.9);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--bdr)}
.brand{display:flex;align-items:center;gap:10px;font-size:.9rem;font-weight:600}
.brand-icon{color:var(--blue);font-size:1.4rem;line-height:1}
.badge{background:rgba(79,156,249,.12);border:1px solid rgba(79,156,249,.28);color:var(--blue);font-size:.65rem;font-weight:600;padding:2px 8px;border-radius:99px;letter-spacing:.04em;text-transform:uppercase}
.hints{display:flex;gap:18px}
.hint{font-size:.72rem;color:var(--muted)}
kbd{background:var(--surf2);border:1px solid var(--bdr);border-radius:3px;padding:1px 5px;font-size:.68rem;font-family:inherit;color:var(--txt)}
.btn-tour{background:var(--blue);color:#fff;border:none;padding:7px 16px;border-radius:7px;font-size:.8rem;font-weight:600;cursor:pointer;transition:opacity .2s,background .2s;white-space:nowrap}
.btn-tour:hover{opacity:.85}
.btn-tour.active{background:#e74c3c}
@media(max-width:700px){.hints{display:none}}

/* HOTSPOT LABELS */
#lc{position:fixed;top:0;left:0;pointer-events:none;z-index:60;width:100%;height:100%}
.hl{position:absolute;transform:translate(-50%,-115%);background:rgba(6,9,15,.92);border:1px solid var(--bdr);border-radius:6px;padding:4px 10px;font-size:.7rem;font-weight:500;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
.hl::after{content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:0;height:0;border:5px solid transparent;border-top-width:5px;border-top-style:solid}

/* INFO PANEL */
#panel{position:fixed;right:20px;top:70px;width:310px;background:rgba(13,21,37,.97);border:1px solid var(--bdr);border-radius:16px;padding:22px;z-index:200;backdrop-filter:blur(24px);opacity:0;pointer-events:none;transform:translateX(44px);transition:opacity .35s,transform .35s cubic-bezier(.4,0,.2,1)}
#panel.open{opacity:1;pointer-events:all;transform:translateX(0)}
.pcls{position:absolute;top:12px;right:12px;background:var(--surf2);border:1px solid var(--bdr);color:var(--muted);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.75rem;transition:color .2s}
.pcls:hover{color:var(--txt)}
.pbadge{display:inline-block;font-size:.66rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:99px;margin-bottom:10px}
#panel h2{font-size:1rem;font-weight:700;margin-bottom:6px;line-height:1.3}
#panel p{font-size:.78rem;color:var(--muted);line-height:1.65;margin-bottom:16px}
.kgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.kpi{background:var(--surf2);border:1px solid var(--bdr);border-radius:9px;padding:11px 6px;text-align:center}
.kv{font-size:1.15rem;font-weight:700;line-height:1}
.kl{font-size:.62rem;color:var(--muted);margin-top:4px;line-height:1.3}
.vpl{background:var(--surf2);border:1px solid var(--bdr);border-radius:9px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:border-color .2s}
.vpl:hover{border-color:var(--blue)}
.vi{width:38px;height:38px;border-radius:50%;background:rgba(79,156,249,.12);display:flex;align-items:center;justify-content:center;font-size:.85rem;color:var(--blue)}
.vpl span{font-size:.78rem;font-weight:500}
.vs{font-size:.67rem;color:var(--muted)}

/* TOUR OVERLAY */
#tour{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;background:rgba(13,21,37,.96);border:1px solid var(--bdr);border-radius:12px;padding:12px 18px;backdrop-filter:blur(20px);min-width:300px;opacity:0;pointer-events:none;transition:opacity .3s}
#tour.open{opacity:1;pointer-events:all}
.tbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
#tlbl{font-size:.8rem;font-weight:500}
.tstp{background:transparent;border:1px solid var(--bdr);color:var(--muted);padding:3px 10px;border-radius:5px;font-size:.72rem;cursor:pointer}
.dots{display:flex;gap:7px;justify-content:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--bdr);transition:background .3s,transform .3s}
.dot.active{background:var(--blue);transform:scale(1.3)}
.dot.done{background:var(--muted)}

/* KEY HINTS */
#kh{position:fixed;bottom:20px;left:20px;z-index:100}
.kr{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.kr span{font-size:.68rem;color:var(--muted)}

@media(prefers-reduced-motion:reduce){#panel,#tour{transition:none}}
@media(max-width:600px){#panel{width:calc(100vw - 32px);right:16px;top:auto;bottom:68px}}
</style>
</head>
<body>
<canvas id="c" aria-label="Interactive 3D corporate campus. Click hotspots or use keys 1-3 to navigate zones."></canvas>

<nav id="nav">
  <div class="brand">
    <span class="brand-icon">⬡</span>
    <span>Nexus Corp <span class="badge">Investor Tour 2025</span></span>
  </div>
  <div class="hints" aria-hidden="true">
    <span class="hint">Drag · rotate</span>
    <span class="hint">Scroll · zoom</span>
    <span class="hint"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> views</span>
    <span class="hint"><kbd>Esc</kbd> overview</span>
  </div>
  <button id="tbtn" class="btn-tour" aria-label="Start guided investor tour">&#9654; Start Tour</button>
</nav>

<div id="lc" aria-hidden="true"></div>

<aside id="panel" role="dialog" aria-modal="true" aria-labelledby="ptitle">
  <button class="pcls" id="pcls" aria-label="Close panel">&#10005;</button>
  <div class="pbadge" id="pbadge"></div>
  <h2 id="ptitle"></h2>
  <p id="pdesc"></p>
  <div class="kgrid" id="kgrid"></div>
  <div class="vpl" role="button" tabindex="0" aria-label="Watch narrated video overview">
    <div class="vi">&#9654;</div>
    <span>Watch Narrated Overview</span>
    <div class="vs">CC &middot; Transcript available</div>
  </div>
</aside>

<div id="tour" role="status" aria-live="polite">
  <div class="tbar">
    <span id="tlbl">Starting tour&hellip;</span>
    <button class="tstp" id="tstp" aria-label="End guided tour">&#10005; End</button>
  </div>
  <div class="dots" id="dots"></div>
</div>

<div id="kh" aria-hidden="true">
  <div class="kr"><kbd>1</kbd><span>Strategy</span></div>
  <div class="kr"><kbd>2</kbd><span>Finance</span></div>
  <div class="kr"><kbd>3</kbd><span>R&amp;D</span></div>
  <div class="kr"><kbd>Esc</kbd><span>Overview</span></div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const g = window.gsap;
const RM = matchMedia('(prefers-reduced-motion:reduce)').matches;

// ── RENDERER ─────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const R = new THREE.WebGLRenderer({ canvas, antialias: true });
R.setPixelRatio(Math.min(devicePixelRatio, 2));
R.setSize(innerWidth, innerHeight);
R.shadowMap.enabled = true;
R.shadowMap.type = THREE.PCFSoftShadowMap;
R.toneMapping = THREE.ACESFilmicToneMapping;
R.toneMappingExposure = 0.85;
R.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06090f);
scene.fog = new THREE.Fog(0x06090f, 40, 90);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(14, 9, 20);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 3.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 6;
controls.maxDistance = 45;
controls.maxPolarAngle = Math.PI / 2.05;
controls.update();

// Environment for reflections
const pmrem = new THREE.PMREMGenerator(R);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ── LIGHTS ───────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x1a2a5a, 4));

const sun = new THREE.DirectionalLight(0xc8e0ff, 2.5);
sun.position.set(12, 22, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { near: 1, far: 70, left: -22, right: 22, top: 22, bottom: -22 });
scene.add(sun);

const fill = new THREE.DirectionalLight(0x3050a0, 0.8);
fill.position.set(-10, 6, -8);
scene.add(fill);

// ── WINDOW TEXTURE ───────────────────────────────────────────────────────────
function winTex(rows, cols) {
  const cv = document.createElement('canvas');
  cv.width = 256;
  cv.height = Math.round(256 * (rows / cols) * 1.6);
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#09142a';
  ctx.fillRect(0, 0, cv.width, cv.height);
  const cw = cv.width / cols, ch = cv.height / rows;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (Math.random() > 0.28) {
        const warm = Math.random() > 0.5;
        ctx.fillStyle = warm
          ? `rgba(255,215,130,${.25 + Math.random() * .45})`
          : `rgba(130,190,255,${.25 + Math.random() * .5})`;
        ctx.fillRect(c * cw + 2, r * ch + 2, cw - 4, ch - 4);
      }
    }
  }
  return new THREE.CanvasTexture(cv);
}

// ── MATERIALS ────────────────────────────────────────────────────────────────
const mWall = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.45, metalness: 0.55 });
const mGlass = (c, tex) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.1, metalness: 0.85, transparent: true, opacity: 0.9, map: tex || null });
const mGround = new THREE.MeshStandardMaterial({ color: 0x07101e, roughness: 0.92, metalness: 0.05 });

function addMesh(geo, mat, px, py, pz) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(px, py, pz);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  return m;
}

// ── BUILDINGS ────────────────────────────────────────────────────────────────
// Main tower
addMesh(new THREE.BoxGeometry(2.8, 12, 2.8), mGlass(0x122040, winTex(18, 3)), 0, 6, 0);
addMesh(new THREE.BoxGeometry(0.7, 1.8, 0.7), mWall(0x4f9cf9), 0, 12.9, 0);
addMesh(new THREE.CylinderGeometry(0, 0.07, 2.2, 8), mWall(0x7aaeff), 0, 14.1, 0);

// Left wing – Strategy
addMesh(new THREE.BoxGeometry(5.8, 5.2, 3.2), mGlass(0x0e1c38, winTex(8, 7)), -4.2, 2.6, 0);
addMesh(new THREE.BoxGeometry(3.2, 0.18, 4.5), mGlass(0x3060b0), -4.2, 0.1, 1.6);

// Right wing – R&D
addMesh(new THREE.BoxGeometry(4.6, 6.8, 3.2), mGlass(0x0c1830, winTex(10, 5)), 4.0, 3.4, 0);
addMesh(new THREE.BoxGeometry(4.6, 0.15, 3.2), mWall(0x182a50), 4.0, 6.85, 0);

// Lobby connector
addMesh(new THREE.BoxGeometry(15, 1.5, 4.8), mWall(0x0c1830), 0, 0.75, 0);

// Pillars
for (const x of [-6, -3.5, 0, 3.5, 6])
  addMesh(new THREE.CylinderGeometry(0.14, 0.14, 1.5, 8), mWall(0x182a50), x, 0.75, 2.3);

// Balcony strips
for (const [bx, by, bw] of [[-4.2, 4.8, 5.8], [4.0, 5.5, 4.6], [4.0, 4.0, 4.6]])
  addMesh(new THREE.BoxGeometry(bw, 0.12, 0.7), mWall(0x1a3060), bx, by, 1.75);

// Ground
const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), mGround);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(80, 80, 0x152040, 0x0d1830);
grid.position.y = 0.01;
scene.add(grid);

// Subtle ground glow ring
const glowGeo = new THREE.RingGeometry(1, 14, 64);
const glowMat = new THREE.MeshBasicMaterial({ color: 0x1a3a80, transparent: true, opacity: 0.12, side: THREE.DoubleSide });
const glow = new THREE.Mesh(glowGeo, glowMat);
glow.rotation.x = -Math.PI / 2;
glow.position.y = 0.02;
scene.add(glow);

// ── HOTSPOT DATA ─────────────────────────────────────────────────────────────
const HS = [
  {
    id: 'strategy',
    label: 'Strategy & Vision',
    col: 0x4f9cf9, hex: '#4f9cf9',
    pos: new THREE.Vector3(-4.2, 4.2, 2.2),
    cam: new THREE.Vector3(-8.5, 6.5, 10),
    tgt: new THREE.Vector3(-4, 3.5, 0),
    kpis: [
      { l: 'Market Share', v: 34, s: '%' },
      { l: 'Growth Rate', v: 127, s: '%' },
      { l: 'Key Markets', v: 48, s: '' }
    ],
    desc: 'Global expansion strategy driving sustained growth across emerging markets, anchored in digital transformation and long-term strategic partnerships.'
  },
  {
    id: 'finance',
    label: 'Financial Performance',
    col: 0x34d399, hex: '#34d399',
    pos: new THREE.Vector3(0.4, 9.5, 2.0),
    cam: new THREE.Vector3(5.5, 11.5, 10),
    tgt: new THREE.Vector3(0, 8.5, 0),
    kpis: [
      { l: 'Revenue', v: 2.4, s: 'B' },
      { l: 'EBITDA', v: 38, s: '%' },
      { l: 'YoY Growth', v: 22, s: '%' }
    ],
    desc: 'Consistent revenue growth with improving margins driven by operational efficiency, premium product positioning, and disciplined capital allocation.'
  },
  {
    id: 'rd',
    label: 'Research & Development',
    col: 0xf59e0b, hex: '#f59e0b',
    pos: new THREE.Vector3(4.0, 4.8, 2.2),
    cam: new THREE.Vector3(9, 7, 10),
    tgt: new THREE.Vector3(4, 4, 0),
    kpis: [
      { l: 'Patents Filed', v: 847, s: '' },
      { l: 'R&D Spend', v: 14, s: '%' },
      { l: 'Pipeline', v: 23, s: '' }
    ],
    desc: 'Industry-leading R&D pipeline with breakthrough innovations in AI, sustainable technology, and next-generation materials science.'
  }
];

// ── HOTSPOT MESHES ───────────────────────────────────────────────────────────
const clickables = [];

HS.forEach(h => {
  const grp = new THREE.Group();
  grp.position.copy(h.pos);

  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(0.17, 20, 20),
    new THREE.MeshBasicMaterial({ color: h.col })
  );
  sphere.userData.hid = h.id;
  clickables.push(sphere);
  grp.add(sphere);

  const r1mat = new THREE.MeshBasicMaterial({ color: h.col, transparent: true, opacity: 0.7, side: THREE.DoubleSide, depthWrite: false });
  const r2mat = new THREE.MeshBasicMaterial({ color: h.col, transparent: true, opacity: 0.3, side: THREE.DoubleSide, depthWrite: false });
  const r1 = new THREE.Mesh(new THREE.RingGeometry(0.23, 0.3, 32), r1mat);
  const r2 = new THREE.Mesh(new THREE.RingGeometry(0.38, 0.44, 32), r2mat);
  r1.rotation.x = r2.rotation.x = -Math.PI / 2;
  grp.add(r1, r2);

  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.018, 0.018, 0.9, 6),
    new THREE.MeshBasicMaterial({ color: h.col, transparent: true, opacity: 0.4 })
  );
  pole.position.y = -0.55;
  grp.add(pole);

  scene.add(grp);
  h._r1 = r1; h._r2 = r2; h._sphere = sphere;

  const pt = new THREE.PointLight(h.col, 3.5, 5.5);
  pt.position.copy(h.pos);
  scene.add(pt);
});

// ── HTML LABELS ──────────────────────────────────────────────────────────────
const lc = document.getElementById('lc');
HS.forEach(h => {
  const el = document.createElement('div');
  el.className = 'hl';
  el.textContent = h.label;
  el.style.color = h.hex;
  el.style.borderColor = h.hex + '55';
  el.style.setProperty('--hl-bdr', h.hex);
  lc.appendChild(el);
  h._lel = el;
  // ::after border-top-color via inline style on pseudo-element not possible;
  // use box-shadow workaround or just accept default
});

// ── OVERVIEW CAMERA ──────────────────────────────────────────────────────────
const OVP = new THREE.Vector3(14, 9, 20);
const OVT = new THREE.Vector3(0, 3.5, 0);
let animating = false;

function flyTo(tp, tt, dur, cb) {
  dur = dur || 1.5;
  if (RM) {
    camera.position.copy(tp);
    controls.target.copy(tt);
    controls.update();
    cb && cb();
    return;
  }
  animating = true;
  controls.enabled = false;
  const sp = camera.position.clone(), st = controls.target.clone();
  const proxy = { t: 0 };
  g.to(proxy, {
    t: 1, duration: dur, ease: 'power2.inOut',
    onUpdate() {
      camera.position.lerpVectors(sp, tp, proxy.t);
      controls.target.lerpVectors(st, tt, proxy.t);
      controls.update();
    },
    onComplete() {
      animating = false;
      controls.enabled = true;
      cb && cb();
    }
  });
}

// ── PANEL ────────────────────────────────────────────────────────────────────
const panel = document.getElementById('panel');
let panelOpen = false;

function countUp(el, target, suf) {
  const isF = target % 1 !== 0;
  const t0 = Date.now(), dur = 900;
  const tick = () => {
    const p = Math.min((Date.now() - t0) / dur, 1);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = (isF ? (e * target).toFixed(1) : Math.floor(e * target)) + suf;
    if (p < 1) requestAnimationFrame(tick);
  };
  tick();
}

function openPanel(h) {
  const pbadge = document.getElementById('pbadge');
  pbadge.textContent = '● ' + h.label;
  pbadge.style.cssText = `background:${h.hex}18;border:1px solid ${h.hex}44;color:${h.hex}`;
  document.getElementById('ptitle').textContent = h.label;
  document.getElementById('pdesc').textContent = h.desc;
  const kg = document.getElementById('kgrid');
  kg.innerHTML = '';
  h.kpis.forEach(k => {
    const d = document.createElement('div');
    d.className = 'kpi';
    const v = document.createElement('div');
    v.className = 'kv';
    v.style.color = h.hex;
    v.textContent = '0' + k.s;
    const l = document.createElement('div');
    l.className = 'kl';
    l.textContent = k.l;
    d.append(v, l);
    kg.appendChild(d);
    setTimeout(() => countUp(v, k.v, k.s), 250);
  });
  panel.classList.add('open');
  panelOpen = true;
}

function closePanel() {
  panel.classList.remove('open');
  panelOpen = false;
}

document.getElementById('pcls').addEventListener('click', () => {
  closePanel();
  if (!tourActive) flyTo(OVP, OVT, 1.2, null);
});

// ── TOUR ─────────────────────────────────────────────────────────────────────
let tourActive = false, tourIdx = 0, tourTmr = null;
const DWELL = 7500;
const tourEl = document.getElementById('tour');
const tlbl = document.getElementById('tlbl');
const dotsEl = document.getElementById('dots');
const tbtn = document.getElementById('tbtn');

HS.forEach((_, i) => {
  const d = document.createElement('div');
  d.className = 'dot';
  d.id = 'dot-' + i;
  dotsEl.appendChild(d);
});

function updateDots(ai) {
  HS.forEach((_, i) => {
    document.getElementById('dot-' + i).className =
      'dot' + (i === ai ? ' active' : i < ai ? ' done' : '');
  });
}

function startTour() {
  tourActive = true;
  tourIdx = 0;
  tourEl.classList.add('open');
  tbtn.textContent = '■ Stop Tour';
  tbtn.classList.add('active');
  closePanel();
  runTourStep(0);
}

function runTourStep(i) {
  if (!tourActive) return;
  const h = HS[i];
  tlbl.textContent = (i + 1) + ' / ' + HS.length + ' — ' + h.label;
  updateDots(i);
  closePanel();
  flyTo(h.cam, h.tgt, RM ? 0 : 2, function() {
    if (!tourActive) return;
    openPanel(h);
    tourTmr = setTimeout(function() {
      const next = i + 1;
      if (next < HS.length) runTourStep(next);
      else endTour();
    }, DWELL);
  });
}

function endTour() {
  tourActive = false;
  clearTimeout(tourTmr);
  tourEl.classList.remove('open');
  tbtn.textContent = '▶ Start Tour';
  tbtn.classList.remove('active');
  closePanel();
  flyTo(OVP, OVT, 1.5, null);
}

tbtn.addEventListener('click', function() { tourActive ? endTour() : startTour(); });
document.getElementById('tstp').addEventListener('click', endTour);

// ── RAYCASTING ───────────────────────────────────────────────────────────────
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();

canvas.addEventListener('click', function(e) {
  if (animating || tourActive) return;
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(clickables);
  if (hits.length) {
    const h = HS.find(x => x.id === hits[0].object.userData.hid);
    if (h) { closePanel(); flyTo(h.cam, h.tgt, 1.5, function() { openPanel(h); }); }
  }
});

canvas.addEventListener('mousemove', function(e) {
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  canvas.style.cursor = ray.intersectObjects(clickables).length ? 'pointer' : 'grab';
});

// ── KEYBOARD ─────────────────────────────────────────────────────────────────
window.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { endTour(); closePanel(); flyTo(OVP, OVT, 1.2, null); }
  const idx = { '1': 0, '2': 1, '3': 2 }[e.key];
  if (idx !== undefined && !tourActive) {
    const h = HS[idx];
    closePanel();
    flyTo(h.cam, h.tgt, 1.5, function() { openPanel(h); });
  }
});

// ── RESIZE ───────────────────────────────────────────────────────────────────
window.addEventListener('resize', function() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  R.setSize(innerWidth, innerHeight);
});

// ── RENDER LOOP ──────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
const _v = new THREE.Vector3();

function screenPos(wp) {
  _v.copy(wp).project(camera);
  return {
    x: (_v.x * .5 + .5) * innerWidth,
    y: (-_v.y * .5 + .5) * innerHeight,
    behind: _v.z > 1
  };
}

(function loop() {
  requestAnimationFrame(loop);
  const t = clock.getElapsedTime();
  controls.update();

  // Animate hotspots & labels
  HS.forEach(function(h, i) {
    if (!RM) {
      const ph = t * 1.5 + i * 1.3;
      h._r1.scale.setScalar(1 + .14 * Math.sin(ph));
      h._r2.scale.setScalar(1 + .22 * Math.sin(ph * .7));
      h._r2.material.opacity = .18 + .14 * Math.sin(ph * .9);
      h._sphere.scale.setScalar(1 + .04 * Math.sin(ph * 2));
    }
    const sp = screenPos(h.pos);
    h._lel.style.left = sp.x + 'px';
    h._lel.style.top = (sp.y - 22) + 'px';
    h._lel.style.opacity = sp.behind ? '0' : '1';
  });

  // Subtle glow pulse
  if (!RM) {
    glowMat.opacity = 0.08 + 0.04 * Math.sin(t * 0.5);
  }

  R.render(scene, camera);
})();
</script>
</body>
