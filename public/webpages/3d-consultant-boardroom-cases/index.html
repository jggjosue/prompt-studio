<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultor 3D — Sala de Casos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo"><span class="logo-tie">■</span><span>Consultor 3D</span></div>
      <div class="topbar-actions">
        <button id="compare-btn" class="btn btn-sm btn-outline">⇄ Comparar</button>
        <button id="contact-btn" class="btn btn-sm btn-outline">✉ Contacto</button>
        <button id="resources-btn" class="btn btn-sm btn-outline">📄 Recursos</button>
        <button id="analytics-btn" class="btn btn-sm btn-outline" title="Analytics">📊</button>
        <button id="fallback-btn" class="btn btn-sm btn-outline">♿</button>
      </div>
    </header>

    <div id="main">
      <div id="scene-root" role="img" aria-label="Sala boardroom 3D con mesas de casos de estudio"></div>

      <div id="case-panel" class="hidden">
        <button id="case-close" class="panel-close">&times;</button>
        <div class="case-inner">
          <div class="case-video-wrap">
            <video id="case-video" controls preload="metadata" crossorigin="anonymous" playsinline></video>
          </div>
          <div id="case-meta" class="case-meta"></div>
          <div id="case-metrics" class="case-metrics"></div>
          <div id="case-caption" class="case-caption"></div>
        </div>
      </div>

      <div id="compare-panel" class="hidden">
        <div class="compare-header">
          <h3>⇄ Comparar casos</h3>
          <button id="compare-close" class="btn btn-sm btn-outline">×</button>
        </div>
        <div class="compare-grid" id="compare-grid"></div>
      </div>

      <div id="contact-panel" class="hidden">
        <div class="contact-header">
          <h3>✉ Contacto</h3>
          <button id="contact-close" class="btn btn-sm btn-outline">×</button>
        </div>
        <form id="contact-form" class="contact-form">
          <input type="text" placeholder="Nombre" aria-label="Nombre" required>
          <input type="email" placeholder="Email" aria-label="Email" required>
          <textarea placeholder="Mensaje" aria-label="Mensaje" rows="3" required></textarea>
          <button type="submit" class="btn btn-primary" style="width:100%">Enviar</button>
        </form>
      </div>

      <div id="resources-panel" class="hidden">
        <div class="resources-header">
          <h3>📄 Recursos</h3>
          <button id="resources-close" class="btn btn-sm btn-outline">×</button>
        </div>
        <div id="resources-body"></div>
      </div>

      <div id="analytics-panel" class="hidden">
        <div class="analytics-header">
          <h3>📊 Analytics</h3>
          <button id="analytics-close" class="btn btn-sm btn-outline">×</button>
        </div>
        <div id="analytics-body"></div>
      </div>
    </div>

    <div id="fallback-section" class="hidden" aria-live="polite">
      <div class="fallback-inner">
        <h2>■ Versión 2D</h2>
        <div id="fb-cases" class="fb-cases"></div>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="consult3d.js"></script>
</body>
</html>
