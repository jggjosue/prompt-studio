<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Interactive Educational Library</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Newsreader:opsz,wght@6..72,300;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="scene-root"></div>

  <main class="ui">
    <header class="top glass">
      <div>
        <p class="eyebrow">Editorial Learning Hub</p>
        <h1>Aisle Library in 3D</h1>
      </div>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search by keyword (biology, algebra, history...)" aria-label="Search educational clips">
        <button id="toggle-2d" class="btn">2D List</button>
      </div>
    </header>

    <aside class="left glass">
      <h2>Catalog</h2>
      <p id="results" class="muted">Showing all clips</p>
      <div id="list" class="list"></div>
    </aside>

    <aside class="right glass">
      <h2>Favorites</h2>
      <ul id="favorites" class="favorites"></ul>
    </aside>

    <section id="fallback" class="fallback glass hidden" aria-label="2D fallback list with videos and transcript"></section>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Clip player modal">
    <div class="modal-card">
      <button id="close-modal" class="btn close">Close</button>
      <h3 id="modal-title"></h3>
      <video id="modal-video" controls preload="metadata"></video>
      <p id="modal-transcript" class="transcript"></p>
      <button id="fav-btn" class="btn">Add to favorites</button>
    </div>
  </div>

  <script type="module" src="library3d.js"></script>
</body>
</html>
