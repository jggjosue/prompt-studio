<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Wellness Garden — Meditation & Ambient Sound</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="scene-root"></div>

  <audio id="ambient-audio" loop preload="auto" crossorigin="anonymous">
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <main class="ui">
    <header class="top glass">
      <div>
        <p class="eyebrow">Wellness Garden 3D</p>
        <h1>Meditation &amp; Ambient Sound</h1>
      </div>
      <div class="actions">
        <button id="toggle-ambient" class="btn">🔇 Silenciar ambiente</button>
        <button id="mode-toggle" class="btn">Modo libre</button>
        <button id="fallback-toggle" class="btn">Fallback 2D</button>
      </div>
    </header>

    <section class="panel glass">
      <h2>Puntos de descanso</h2>
      <div class="row" id="spot-buttons">
        <button class="btn spot-btn" data-spot="0">🧘 Banco del cerezo</button>
        <button class="btn spot-btn" data-spot="1">🌿 Fuente de loto</button>
        <button class="btn spot-btn" data-spot="2">🪨 Círculo de piedras</button>
      </div>
      <p id="spot-copy" class="copy">Acércate a un punto de descanso o haz clic para iniciar una sesión de bienestar con video y sonido ambiental.</p>
      <div id="session-info" class="session-info">
        <p class="anno-meta" id="breath-indicator">🌬️ Respiración guiada disponible al activar una sesión.</p>
      </div>
    </section>

    <section id="fallback" class="fallback glass hidden" aria-label="2D fallback with wellness videos"></section>
  </main>

  <div id="session-dialog" class="dialog hidden" role="dialog" aria-modal="true" aria-label="Wellness session">
    <article class="dialog-card">
      <button id="close-session" class="btn close">✕</button>
      <h3 id="session-title"></h3>
      <div class="session-video-wrap">
        <video id="session-video" controls preload="metadata" crossorigin="anonymous">
          <track kind="captions" srclang="en" label="English" src="assets/subtitles-en.srt" default>
        </video>
      </div>
      <div class="session-body">
        <p id="session-desc" class="desc"></p>
        <div class="session-controls">
          <span id="session-timer" class="timer">0:00</span>
          <button id="audio-only" class="btn">🎵 Solo audio</button>
          <label class="vol-label">
            Volumen
            <input id="vol-slider" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
          </label>
        </div>
        <a class="download" href="assets/transcript.txt" download>📝 Transcripción</a>
      </div>
    </article>
  </div>

  <script type="module" src="garden.js"></script>
</body>
</html>
