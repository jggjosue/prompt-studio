<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Showroom 3D — Diseñador de Producto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo"><span class="logo-icon">◈</span><span>Product Showroom 3D</span></div>
      <div class="variant-selector" id="variant-selector">
        <button class="variant-btn active" data-variant="0">● Blanco</button>
        <button class="variant-btn" data-variant="1">● Negro</button>
        <button class="variant-btn" data-variant="2">● Madera</button>
      </div>
      <div class="topbar-actions">
        <button id="detail-btn" class="btn btn-sm btn-outline" title="Ver detalle">🔍</button>
        <button id="play-btn" class="btn btn-sm btn-outline" title="Play video">▶</button>
        <button id="fallback-btn" class="btn btn-sm btn-outline">♿</button>
      </div>
    </header>

    <div id="main">
      <div id="scene-root" role="img" aria-label="Showroom 3D minimalista con producto en pedestal"></div>

      <div id="hotspot-panel" class="hidden">
        <button id="panel-close" class="panel-close">&times;</button>
        <div class="panel-inner">
          <h3 id="panel-title" class="panel-title"></h3>
          <div class="video-wrapper">
            <video id="panel-video" controls preload="metadata" crossorigin="anonymous"></video>
          </div>
          <p id="panel-desc" class="panel-desc"></p>
        </div>
      </div>

      <div id="analytics-panel" class="hidden">
        <div class="analytics-header">
          <h3>📊 Analytics</h3>
          <button id="analytics-close" class="btn btn-sm btn-outline">×</button>
        </div>
        <div id="analytics-body" class="analytics-body"></div>
      </div>
    </div>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <button id="modal-close" class="modal-close">&times;</button>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>

    <div id="fallback-section" class="hidden" aria-live="polite">
      <div class="fallback-inner"><h2>◈ Showroom — Versión 2D</h2><div id="fb-grid" class="fb-grid"></div></div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="showroom.js"></script>
</body>
</html>
