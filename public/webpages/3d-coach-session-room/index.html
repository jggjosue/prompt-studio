<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coach 3D — Sala de Sesiones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo"><span class="logo-leaf">✦</span><span>Coach 3D</span></div>
      <div class="topbar-actions">
        <button id="livecoach-btn" class="btn btn-sm btn-outline">🎙 Live coaching</button>
        <button id="analytics-btn" class="btn btn-sm btn-outline" title="Analytics">📊</button>
        <button id="fallback-btn" class="btn btn-sm btn-outline">♿</button>
      </div>
    </header>

    <div id="main">
      <div id="scene-root" role="img" aria-label="Sala 3D calmada con estaciones de sesiones guiadas"></div>

      <div id="session-panel" class="hidden">
        <button id="session-close" class="panel-close">&times;</button>
        <div class="session-inner">
          <div class="session-video-wrap">
            <video id="session-video" controls preload="metadata" crossorigin="anonymous" playsinline></video>
            <div id="session-timer" class="session-timer">--:--</div>
          </div>
          <div id="session-meta" class="session-meta"></div>
          <div id="session-sub" class="session-sub" aria-live="polite"></div>
          <div class="session-controls">
            <label class="dur-label">⏱ Duración: <select id="dur-select"><option value="3">3 min</option><option value="5" selected>5 min</option><option value="10">10 min</option></select></label>
            <button id="download-transcript-btn" class="btn btn-sm btn-outline">📄 Transcripción</button>
          </div>
        </div>
      </div>

      <div id="livecoach-panel" class="hidden">
        <div class="livec-header">
          <h3>🎙 Live coaching</h3>
          <button id="livec-close" class="btn btn-sm btn-outline">×</button>
        </div>
        <div class="livec-body">
          <p class="livec-permiso">Para conectarte en vivo, necesitaremos acceso a cámara y micrófono. No grabamos ni almacenamos ninguna imagen o sonido.</p>
          <button id="livec-start" class="btn btn-primary">📷 Activar cámara</button>
          <video id="livec-preview" class="livec-preview hidden" autoplay muted playsinline></video>
        </div>
      </div>

      <div id="analytics-panel" class="hidden">
        <div class="analytics-header">
          <h3>📊 Analytics</h3>
          <button id="analytics-close" class="btn btn-sm btn-outline">×</button>
        </div>
        <div id="analytics-body"></div>
      </div>
    </div>

    <div id="fallback-section" class="hidden" aria-live="polite">
      <div class="fallback-inner">
        <h2>✦ Versión 2D</h2>
        <div id="fb-sessions" class="fb-sessions"></div>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
  <script src="coach3d.js"></script>
</body>
</html>
