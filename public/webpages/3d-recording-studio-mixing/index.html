<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Recording Studio — Session Videos & Interactive Mixing</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="scene-root"></div>

  <main class="ui">
    <header class="top glass">
      <div>
        <p class="eyebrow">Recording Studio 3D</p>
        <h1>Sessions &amp; Interactive Mixing</h1>
      </div>
      <div class="actions">
        <button id="record-toggle" class="btn warn">Grabar</button>
        <button id="export-stems" class="btn">Export stems</button>
        <button id="fallback-toggle" class="btn">Fallback 2D</button>
      </div>
    </header>

    <section class="panel glass">
      <h2>Pistas</h2>
      <div class="row" id="track-buttons">
        <button class="btn track-btn" data-track="0">🎸 Guitarra</button>
        <button class="btn track-btn" data-track="1">🎤 Voz</button>
        <button class="btn track-btn" data-track="2">🥁 Batería</button>
        <button class="btn track-btn" data-track="3">🎹 Teclado</button>
      </div>
      <div class="fader-group" id="fader-group">
        <div class="fader" data-track="0"><label>🎸</label><input type="range" min="0" max="1" step="0.01" value="0.7" class="fader-slider"><span class="fader-val">70%</span></div>
        <div class="fader" data-track="1"><label>🎤</label><input type="range" min="0" max="1" step="0.01" value="0.5" class="fader-slider"><span class="fader-val">50%</span></div>
        <div class="fader" data-track="2"><label>🥁</label><input type="range" min="0" max="1" step="0.01" value="0.8" class="fader-slider"><span class="fader-val">80%</span></div>
        <div class="fader" data-track="3"><label>🎹</label><input type="range" min="0" max="1" step="0.01" value="0.4" class="fader-slider"><span class="fader-val">40%</span></div>
      </div>
      <p id="mix-info" class="copy">Arrastra una pista a la consola central o ajusta los faders para mezclar en vivo.</p>
    </section>

    <section id="fallback" class="fallback glass hidden" aria-label="2D fallback with session videos and mix console"></section>
  </main>

  <div id="dialog" class="dialog hidden" role="dialog" aria-modal="true" aria-label="Session replay">
    <article class="dialog-card">
      <button id="close-dialog" class="btn close">✕</button>
      <h3 id="dialog-title"></h3>
      <video id="dialog-video" controls preload="metadata" crossorigin="anonymous">
        <track kind="captions" srclang="en" label="English" src="assets/subtitles-en.srt" default>
      </video>
      <div class="dialog-body">
        <p id="dialog-desc" class="desc"></p>
        <div class="dialog-actions">
          <a class="download" href="assets/transcript.txt" download>📝 Transcripción</a>
        </div>
      </div>
    </article>
  </div>

  <script type="module" src="studio3d.js"></script>
</body>
</html>
