<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escritor 3D — Biblioteca de Lecturas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo"><span class="logo-book">📖</span><span>Escritor 3D</span></div>
      <div class="topbar-actions">
        <button id="liveread-btn" class="btn btn-sm btn-outline">🎙 Lectura en vivo</button>
        <button id="analytics-btn" class="btn btn-sm btn-outline" title="Analytics">📊</button>
        <button id="fallback-btn" class="btn btn-sm btn-outline">♿</button>
      </div>
    </header>

    <div id="main">
      <div id="scene-root" role="img" aria-label="Biblioteca 3D con libros que proyectan lecturas"></div>

      <div id="reader-panel" class="hidden">
        <button id="reader-close" class="panel-close">&times;</button>
        <div class="reader-inner">
          <div class="reader-video-wrap">
            <video id="reader-video" controls preload="metadata" crossorigin="anonymous" playsinline></video>
          </div>
          <div id="reader-text" class="reader-text"></div>
          <div id="reader-sub" class="reader-sub" aria-live="polite"></div>
          <div id="reader-extras" class="reader-extras"></div>
        </div>
      </div>

      <div id="live-panel" class="hidden">
        <div class="live-header">
          <h3>🎙 Lectura en vivo</h3>
          <button id="live-close" class="btn btn-sm btn-outline">×</button>
        </div>
        <div id="live-body" class="live-body">
          <video id="live-video" controls autoplay muted playsinline></video>
          <p class="live-info">Transmisión en vivo (grabación simulada)</p>
        </div>
      </div>

      <div id="analytics-panel" class="hidden">
        <div class="analytics-header">
          <h3>📊 Analytics</h3>
          <button id="analytics-close" class="btn btn-sm btn-outline">×</button>
        </div>
        <div id="analytics-body"></div>
      </div>
    </div>

    <div id="fallback-section" class="hidden" aria-live="polite">
      <div class="fallback-inner">
        <h2>📖 Versión 2D</h2>
        <div id="fb-books" class="fb-books"></div>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
  <script src="writer3d.js"></script>
</body>
</html>
