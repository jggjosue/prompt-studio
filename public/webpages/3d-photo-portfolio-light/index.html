<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio 3D — Fotografía</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo"><span class="logo-icon">◈</span><span>Portfolio</span></div>
      <nav class="series-nav" id="series-nav">
        <button class="series-btn active" data-series="all">Todas</button>
        <button class="series-btn" data-series="0">Retratos</button>
        <button class="series-btn" data-series="1">Urbano</button>
        <button class="series-btn" data-series="2">Naturaleza</button>
      </nav>
      <div class="topbar-actions">
        <button id="fallback-btn" class="btn btn-sm btn-outline" title="Fallback 2D">♿</button>
      </div>
    </header>

    <div id="main">
      <div id="scene-root" role="img" aria-label="Galería de fotografía 3D light mode"></div>

      <div id="card-overlay" class="hidden" aria-live="polite">
        <div id="card">
          <h2 id="card-title"></h2>
          <div id="card-meta" class="card-meta"></div>
          <p id="card-notes" class="card-notes"></p>
          <div class="card-actions">
            <button id="card-bts-btn" class="btn btn-sm btn-outline">Ver detrás de cámaras</button>
          </div>
        </div>
      </div>
    </div>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <button id="modal-close" class="modal-close" aria-label="Cerrar">&times;</button>
        <video id="modal-video" controls preload="metadata" crossorigin="anonymous">
          <track kind="subtitles" srclang="es" label="Español" src="assets/subs-es.srt">
        </video>
        <div id="modal-transcript" class="modal-transcript"></div>
      </div>
    </div>

    <div id="fallback-section" class="hidden" aria-live="polite">
      <div class="fallback-inner">
        <h2>📷 Portfolio — Versión 2D</h2>
        <div id="fb-grid" class="fb-grid"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="photo3d.js"></script>
</body>
</html>
