<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marca Personal 3D — Showreel Cube</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo"><span class="logo-icon">◈</span><span>Showreel Cube</span></div>
      <div class="topbar-actions">
        <button id="pitch-btn" class="btn btn-sm btn-outline" title="Modo Pitch">🎤 Pitch</button>
        <button id="timeline-btn" class="btn btn-sm btn-outline" title="Timeline proyectos">📁</button>
        <button id="share-btn" class="btn btn-sm btn-outline" title="Compartir">🔗</button>
        <button id="fallback-btn" class="btn btn-sm btn-outline">♿</button>
      </div>
    </header>

    <div id="main">
      <div id="scene-root" role="img" aria-label="Cubo 3D con microvideos de marca personal"></div>
      <div id="drag-hint" class="drag-hint">Arrastra para rotar · Click para expandir</div>

      <div id="video-overlay" class="hidden">
        <button id="overlay-close" class="panel-close">&times;</button>
        <video id="overlay-video" controls preload="metadata" crossorigin="anonymous"></video>
        <div id="overlay-caption" class="overlay-caption"></div>
      </div>

      <div id="timeline-panel" class="hidden">
        <div class="timeline-header">
          <h3>📁 Proyectos</h3>
          <button id="timeline-close" class="btn btn-sm btn-outline">×</button>
        </div>
        <div id="timeline-items" class="timeline-items"></div>
      </div>
    </div>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <button id="modal-close" class="modal-close">&times;</button>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>

    <div id="fallback-section" class="hidden" aria-live="polite">
      <div class="fallback-inner"><h2>🎬 Showreel — Versión 2D</h2><div id="fb-grid" class="fb-grid"></div></div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="personalShow3d.js"></script>
</body>
</html>
