<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freelance 3D — Portafolio Interactivo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo"><span class="logo-icon">◈</span><span>Freelance 3D</span></div>
      <div class="topbar-actions">
        <button id="timeline-btn" class="btn btn-sm btn-outline" title="Timeline proyectos">📁</button>
        <button id="analytics-btn" class="btn btn-sm btn-outline" title="Analytics">📊</button>
        <button id="fallback-btn" class="btn btn-sm btn-outline">♿</button>
      </div>
    </header>

    <div id="main">
      <div id="scene-root" role="img" aria-label="Cubo 3D portafolio freelance con microvideos"></div>

      <div id="face-panel" class="hidden">
        <button id="face-close" class="panel-close">&times;</button>
        <div class="face-inner">
          <h3 id="face-title" class="face-title"></h3>
          <div class="video-wrapper">
            <video id="face-video" controls preload="metadata" crossorigin="anonymous"></video>
          </div>
          <div id="face-meta" class="face-meta"></div>
          <div id="face-srt" class="face-srt hidden"><details><summary>📄 Subtítulos</summary><div id="face-srt-body" class="face-srt-body"></div></details></div>
          <button id="face-case-btn" class="btn btn-primary">Ver caso completo</button>
        </div>
      </div>

      <div id="showcase-vitrine" class="hidden">
        <button id="vitrine-close" class="panel-close">&times;</button>
        <div class="vitrine-inner">
          <div id="vitrine-scene" class="vitrine-scene"></div>
          <video id="vitrine-video" controls preload="metadata" crossorigin="anonymous" class="vitrine-video"></video>
        </div>
      </div>

      <div id="timeline-panel" class="hidden">
        <div class="timeline-header">
          <h3>📁 Proyectos</h3>
          <button id="timeline-close" class="btn btn-sm btn-outline">×</button>
        </div>
        <div id="timeline-items" class="timeline-items"></div>
      </div>

      <div id="analytics-panel" class="hidden">
        <div class="analytics-header">
          <h3>📊 Analytics</h3>
          <button id="analytics-close" class="btn btn-sm btn-outline">×</button>
        </div>
        <div id="analytics-body" class="analytics-body"></div>
      </div>
    </div>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <button id="modal-close" class="modal-close">&times;</button>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>

    <div id="fallback-section" class="hidden" aria-live="polite">
      <div class="fallback-inner"><h2>◈ Freelance Portafolio — Versión 2D</h2><div id="fb-grid" class="fb-grid"></div></div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
