<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Festival de Cine 3D — Salas, Q&A y Photobooth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo"><span class="logo-star">✦</span><span>FilmFest 3D</span></div>
      <div class="topbar-actions">
        <button id="lobby-btn" class="btn btn-sm btn-outline">🏛 Lobby</button>
        <button id="rooms-btn" class="btn btn-sm btn-outline">🎬 Salas</button>
        <button id="qa-btn" class="btn btn-sm btn-outline">🎤 Q&A</button>
        <button id="photobooth-btn" class="btn btn-sm btn-outline">📸 Photobooth</button>
        <button id="metrics-btn" class="btn btn-sm btn-outline">📊</button>
      </div>
    </header>

    <div id="main">
      <div id="scene-root" role="img" aria-label="Festival de cine 3D con salas de proyección"></div>

      <!-- Room selector -->
      <div id="rooms-panel" class="hidden panel-left" role="dialog" aria-label="Salas">
        <div class="panel-header"><h4>🎬 Salas</h4><button id="rooms-close" class="btn btn-sm btn-outline">×</button></div>
        <div id="rooms-body" class="rooms-body"></div>
      </div>

      <!-- Q&A panel -->
      <div id="qa-panel" class="hidden panel-right" role="dialog" aria-label="Q&A en vivo">
        <div class="panel-header"><h4>🎤 Q&A en vivo</h4><button id="qa-close" class="btn btn-sm btn-outline">×</button></div>
        <div id="qa-body" class="qa-body">
          <p class="qa-empty">Esperando preguntas…</p>
        </div>
        <textarea id="qa-input" placeholder="Envía tu pregunta para el director…" aria-label="Pregunta" disabled></textarea>
        <button id="qa-send" class="btn btn-primary" style="width:100%;margin-top:.1rem" disabled>Enviar</button>
      </div>

      <!-- Photobooth overlay -->
      <div id="photobooth-overlay" class="hidden overlay" role="dialog" aria-label="Photobooth 3D">
        <div class="overlay-box" style="max-width:400px">
          <h4>📸 Photobooth 3D</h4>
          <canvas id="photobooth-canvas" width="320" height="180" style="width:100%;border-radius:8px;margin:.15rem 0"></canvas>
          <p style="font-size:.42rem;color:var(--muted);margin-bottom:.1rem">Pose en la alfombra roja 3D</p>
          <button id="photobooth-capture" class="btn btn-primary" style="width:100%;margin-bottom:.08rem">📸 Capturar frame</button>
          <button id="photobooth-close" class="btn btn-primary" style="width:100%">Cerrar</button>
        </div>
      </div>

      <!-- Metrics panel -->
      <div id="metrics-panel" class="hidden panel-right" role="dialog" aria-label="Métricas">
        <div class="panel-header"><h4>📊 Métricas</h4><button id="metrics-close" class="btn btn-sm btn-outline">×</button></div>
        <div id="metrics-body" class="metrics-body"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="filmfest3d.js"></script>
</body>
</html>
