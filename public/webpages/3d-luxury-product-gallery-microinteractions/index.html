<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Luxury Product Gallery</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lazysizes@5.3.2/lazysizes.min.js" async></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="hidden-videos" aria-hidden="true">
    <video id="promo-1" muted loop playsinline preload="metadata" crossorigin="anonymous" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"></video>
    <video id="promo-2" muted loop playsinline preload="metadata" crossorigin="anonymous" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"></video>
    <video id="promo-3" muted loop playsinline preload="metadata" crossorigin="anonymous" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4"></video>
  </div>

  <div id="scene-root"></div>

  <main class="ui">
    <header class="top glass">
      <div>
        <p class="eyebrow">Maison Collection</p>
        <h1>Luxury Projection Gallery</h1>
      </div>
      <div class="actions">
        <button id="toggle-overlay" class="btn">Accessible Panel</button>
      </div>
    </header>

    <aside class="sidebar glass">
      <h2>Filters</h2>
      <div class="group">
        <label for="filter-collection">Collection</label>
        <select id="filter-collection">
          <option value="all">All</option>
          <option value="heritage">Heritage</option>
          <option value="atelier">Atelier</option>
        </select>
      </div>
      <div class="group">
        <label for="filter-material">Material</label>
        <select id="filter-material">
          <option value="all">All</option>
          <option value="titanium">Titanium</option>
          <option value="ceramic">Ceramic</option>
          <option value="leather">Leather</option>
        </select>
      </div>
      <div class="group">
        <label for="filter-year">Year</label>
        <select id="filter-year">
          <option value="all">All</option>
          <option value="2026">2026</option>
          <option value="2025">2025</option>
          <option value="2024">2024</option>
        </select>
      </div>
      <p class="hint">Hover a showcase to raise its pedestal. Click to open spec sheet and extended clip.</p>
    </aside>

    <nav id="breadcrumbs" class="breadcrumbs glass">Home / Collection / Showcase</nav>
  </main>

  <section id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-describedby="spec-copy">
    <article class="overlay-card">
      <button id="close-overlay" class="btn close">Close</button>
      <h3 id="spec-title"></h3>
      <video id="spec-video" controls preload="metadata" crossorigin="anonymous"></video>
      <p id="subtitles" class="subtitles"></p>
      <p id="spec-copy"></p>
      <div class="spec-list" id="spec-list"></div>
      <a href="assets/transcript.txt" download>Download transcript</a>
    </article>
  </section>

  <script type="module" src="gallery.js"></script>
</body>
</html>
