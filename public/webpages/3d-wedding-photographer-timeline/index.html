<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boda 3D — Timeline Inmersivo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo"><span class="logo-ring">◇</span><span>Boda 3D</span></div>
      <div class="topbar-actions">
        <button id="highlight-btn" class="btn btn-sm btn-outline" title="Highlight reel">⭐</button>
        <button id="analytics-btn" class="btn btn-sm btn-outline" title="Analytics">📊</button>
        <button id="fallback-btn" class="btn btn-sm btn-outline">♿</button>
      </div>
    </header>

    <div id="main">
      <div id="scene-root" role="img" aria-label="Escena 3D de línea de tiempo de boda con pedestales"></div>

      <div id="timeline-bar">
        <div class="timeline-labels">
          <span>Ceremonia</span><span>Votos</span><span>Primer baile</span>
        </div>
        <input type="range" id="timeline-scrub" class="timeline-scrub" min="0" max="1000" value="0">
        <div id="timeline-time" class="timeline-time">--:--</div>
      </div>

      <div id="detail-view" class="hidden">
        <button id="detail-close" class="panel-close">&times;</button>
        <div class="detail-inner">
          <div class="detail-video-wrap">
            <video id="detail-video" controls preload="metadata" crossorigin="anonymous" playsinline></video>
          </div>
          <div id="detail-meta" class="detail-meta"></div>
          <div id="detail-caption" class="detail-caption"></div>
          <div id="detail-credits" class="detail-credits"></div>
        </div>
      </div>

      <div id="highlight-panel" class="hidden">
        <div class="highlight-header">
          <h3>⭐ Highlight Reel</h3>
          <button id="highlight-close" class="btn btn-sm btn-outline">×</button>
        </div>
        <div id="highlight-body"></div>
        <button id="highlight-export-btn" class="btn btn-primary" style="width:100%;margin-top:.3rem">📥 Exportar playlist</button>
      </div>

      <div id="analytics-panel" class="hidden">
        <div class="analytics-header">
          <h3>📊 Analytics</h3>
          <button id="analytics-close" class="btn btn-sm btn-outline">×</button>
        </div>
        <div id="analytics-body"></div>
      </div>
    </div>

    <div id="fallback-section" class="hidden" aria-live="polite">
      <div class="fallback-inner">
        <h2>◇ Versión 2D</h2>
        <div id="fb-timeline" class="fb-timeline"></div>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="wedding3d.js"></script>
</body>
</html>
