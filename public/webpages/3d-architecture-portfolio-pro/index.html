<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Arquitectura 3D — Walkthrough Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo"><span class="logo-icon">◈</span><span>Arquitectura 3D</span></div>
      <div class="mode-toggle">
        <button id="mode-free" class="mode-btn active" title="Modo libre WASD">🗺 Libre</button>
        <button id="mode-guided" class="mode-btn" title="Fly‑through guiado">🎬 Guiado</button>
      </div>
      <div class="layer-toggles" id="layer-toggles">
        <label><input type="checkbox" data-layer="structure" checked> Estructura</label>
        <label><input type="checkbox" data-layer="finishes" checked> Acabados</label>
        <label><input type="checkbox" data-layer="furniture" checked> Mobiliario</label>
      </div>
      <div class="topbar-actions">
        <button id="before-after-btn" class="btn btn-sm btn-outline" title="Antes/Después">🔄</button>
        <button id="plans-btn" class="btn btn-sm btn-outline" title="Descargar planos">📐</button>
        <button id="fallback-btn" class="btn btn-sm btn-outline">♿</button>
      </div>
    </header>

    <div id="main">
      <div id="scene-root" role="img" aria-label="Plaza virtual 3D con proyectos arquitectónicos"></div>

      <div id="controls-hint" class="controls-hint hidden">
        <span>WASD + Ratón · Click en proyecto para entrar</span>
        <button id="hint-close" class="btn btn-xs">&times;</button>
      </div>

      <div id="project-panel" class="hidden">
        <button id="project-close" class="panel-close">&times;</button>
        <div class="project-inner">
          <h3 id="project-title" class="project-title"></h3>
          <div class="video-wrapper">
            <video id="project-video" controls preload="metadata" crossorigin="anonymous"></video>
          </div>
          <div id="before-after-slider" class="hidden before-after-slider">
            <div class="ba-label">Render</div>
            <input type="range" id="ba-range" min="0" max="100" value="50">
            <div class="ba-label">Real</div>
          </div>
          <p id="project-desc" class="project-desc"></p>
          <div id="project-meta" class="project-meta"></div>
          <div id="hotspots" class="hotspots"></div>
          <div class="project-actions">
            <button id="download-plan-btn" class="btn btn-xs">📄 Plano PDF</button>
            <a id="project-link" class="project-link" target="_blank" rel="noopener">🔊 Entrevista</a>
          </div>
        </div>
      </div>
    </div>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <button id="modal-close" class="modal-close">&times;</button>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>

    <div id="fallback-section" class="hidden" aria-live="polite">
      <div class="fallback-inner"><h2>🏛 Portfolio Arquitectura — Versión 2D</h2><div id="fb-grid" class="fb-grid"></div></div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="arch3d.js"></script>
</body>
</html>
