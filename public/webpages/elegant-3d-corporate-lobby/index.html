<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NEXUS — Corporate Lobby</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"}}</script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08090e;--dark:#0d0f18;--panel:#10121e;--border:#1e2438;
  --text:#e8e4dc;--muted:#8a8478;--gold:#c9a84c;--gold2:#e8c96d;
  --cream:#f5f0e8;--font:'Georgia',serif;--sans:system-ui,sans-serif
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font)}
canvas{display:block;position:fixed;inset:0}

/* INTRO FADE */
#intro-veil{position:fixed;inset:0;background:#000;z-index:100;pointer-events:none;transition:opacity 1.2s ease}
#intro-veil.gone{opacity:0}

/* NAV */
#nav{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;padding:0 2rem;z-index:50;opacity:0;transition:opacity .8s ease}
#nav.show{opacity:1}
.nav-logo{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo-mark{width:32px;height:32px;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;letter-spacing:.15em;color:var(--gold)}
.logo-name{font-size:1rem;font-weight:400;letter-spacing:.35em;color:var(--cream);text-transform:uppercase}
.logo-tagline{font-size:.6rem;letter-spacing:.2em;color:var(--muted);font-family:var(--sans);text-transform:uppercase}
.nav-actions{display:flex;gap:.75rem;align-items:center}
.nav-link{font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);background:transparent;border:none;cursor:pointer;font-family:var(--sans);padding:6px 12px;border-radius:2px;transition:color .2s}
.nav-link:hover{color:var(--gold)}
.nav-link.ghost{border:1px solid rgba(201,168,76,.3);color:var(--gold);padding:6px 14px}
.nav-link.ghost:hover{background:rgba(201,168,76,.08)}

/* HOTSPOT LABELS */
.hs-label{position:fixed;pointer-events:none;transform:translate(-50%,-100%);z-index:20;opacity:0;transition:opacity .4s ease;text-align:center}
.hs-label.show{opacity:1}
.hs-label-name{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-family:var(--sans);background:rgba(8,9,14,.85);padding:3px 10px;border-radius:1px;border:1px solid rgba(201,168,76,.2);white-space:nowrap}

/* VIDEO MODAL */
#modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .45s ease;background:rgba(4,5,8,.92);backdrop-filter:blur(8px)}
#modal.open{opacity:1;pointer-events:all}
#modal-box{width:min(780px,94vw);display:flex;flex-direction:column;gap:0}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.2rem;border:1px solid rgba(201,168,76,.2);border-bottom:none;background:var(--dark)}
.modal-cat{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-family:var(--sans)}
.modal-title{font-size:1rem;font-weight:400;letter-spacing:.05em;color:var(--cream);margin-top:2px}
.modal-close{background:transparent;border:1px solid rgba(255,255,255,.12);color:var(--muted);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:.75rem;display:flex;align-items:center;justify-content:center;transition:all .2s;font-family:var(--sans)}
.modal-close:hover{border-color:var(--gold);color:var(--gold)}

/* VIDEO PLAYER */
.vid-wrap{border:1px solid rgba(201,168,76,.15);border-top:none;border-bottom:none;background:#000;position:relative}
#vid-canvas{width:100%;display:block;aspect-ratio:16/9}
.sub-wrap{min-height:36px;display:flex;align-items:center;justify-content:center;padding:6px 1rem;background:rgba(0,0,0,.75);border-top:1px solid rgba(255,255,255,.05)}
#sub-text{font-size:.8rem;color:#f0ede4;text-align:center;line-height:1.5;font-family:var(--sans);letter-spacing:.02em}

.vid-ctrls{padding:.65rem 1rem;background:var(--dark);border:1px solid rgba(201,168,76,.15);border-top:none;border-bottom:none}
.prog-track{width:100%;height:2px;background:rgba(255,255,255,.08);border-radius:1px;cursor:pointer;margin-bottom:.6rem;position:relative}
.prog-fill{height:100%;border-radius:1px;background:var(--gold);pointer-events:none}
.ctrl-row{display:flex;align-items:center;gap:.5rem}
.ctrl-btn{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:.85rem;padding:3px 5px;font-family:var(--sans);transition:color .15s}
.ctrl-btn:hover{color:var(--gold)}
.vid-time{font-size:.6rem;color:var(--muted);margin-left:auto;letter-spacing:.06em;font-family:var(--sans)}
.cc-btn{padding:2px 7px;border:1px solid rgba(255,255,255,.12);background:transparent;color:var(--muted);font-size:.58rem;letter-spacing:.1em;font-weight:700;cursor:pointer;font-family:var(--sans);border-radius:1px;transition:all .15s}
.cc-btn.on{background:var(--gold);color:#000;border-color:var(--gold)}
.chap-row{display:flex;gap:6px;flex-wrap:wrap;padding:.6rem 1rem;border:1px solid rgba(201,168,76,.15);border-top:1px solid rgba(255,255,255,.04);background:var(--dark)}
.chap-btn{padding:3px 10px;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--muted);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;font-family:var(--sans);border-radius:1px;transition:all .15s}
.chap-btn.active,.chap-btn:hover{border-color:var(--gold);color:var(--gold)}

.modal-footer{display:flex;gap:1rem;align-items:flex-start;padding:.85rem 1.2rem;border:1px solid rgba(201,168,76,.2);border-top:none;background:var(--dark)}
#modal-desc{font-size:.78rem;color:var(--muted);line-height:1.65;flex:1;font-family:var(--sans)}
.modal-stats{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.stat-pill{font-size:.62rem;letter-spacing:.1em;color:var(--gold);border:1px solid rgba(201,168,76,.25);padding:3px 10px;text-align:center;font-family:var(--sans)}

/* 2D FALLBACK */
#view2d{position:fixed;inset:0;top:56px;background:var(--bg);overflow-y:auto;display:none;z-index:60}
.v2d-hero{height:340px;background:linear-gradient(180deg,#0a0c14 0%,#06080f 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;border-bottom:1px solid var(--border)}
.v2d-logo-big{font-size:2.5rem;letter-spacing:.5em;color:var(--cream);text-transform:uppercase;font-weight:400}
.v2d-logo-line{width:60px;height:1px;background:var(--gold)}
.v2d-tagline{font-size:.75rem;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);font-family:var(--sans)}
.v2d-content{max-width:900px;margin:0 auto;padding:2.5rem 1.5rem}
.v2d-section-lbl{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-family:var(--sans);margin-bottom:1.5rem;padding-bottom:.5rem;border-bottom:1px solid rgba(201,168,76,.15)}
.v2d-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem;margin-bottom:2.5rem}
.v2d-card{border:1px solid var(--border);padding:1.25rem;background:var(--dark);cursor:pointer;transition:border-color .2s}
.v2d-card:hover{border-color:rgba(201,168,76,.4)}
.v2d-card-cat{font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-family:var(--sans);margin-bottom:.5rem}
.v2d-card-title{font-size:.95rem;color:var(--cream);margin-bottom:.4rem;letter-spacing:.02em}
.v2d-card-desc{font-size:.75rem;color:var(--muted);line-height:1.6;font-family:var(--sans)}
.v2d-vid-wrap{border:1px solid var(--border);margin-bottom:2rem;background:#000}
#v2d-vid-canvas{width:100%;display:block;aspect-ratio:16/9}
.v2d-vid-ctrls{padding:.6rem 1rem;background:var(--dark);display:flex;align-items:center;gap:.5rem}

/* PREFERS-REDUCED-MOTION */
@media(prefers-reduced-motion:reduce){
  #intro-veil,#nav,#modal,.hs-label{transition:none}
}
</style>
</head>
<body>

<!-- Intro veil -->
<div id="intro-veil"></div>

<!-- Canvas -->
<canvas id="c"></canvas>

<!-- Hotspot labels -->
<div id="labels"></div>

<!-- Nav -->
<nav id="nav">
  <div class="nav-logo">
    <div class="logo-mark">N</div>
    <div>
      <div class="logo-name">Nexus</div>
      <div class="logo-tagline">Corporation</div>
    </div>
  </div>
  <div class="nav-actions">
    <button class="nav-link" id="btn-tour">Guided Tour</button>
    <div style="width:1px;height:16px;background:var(--border)"></div>
    <button class="nav-link ghost" id="btn-2d">2D View</button>
  </div>
</nav>

<!-- Video Modal -->
<div id="modal">
  <div id="modal-box">
    <div class="modal-header">
      <div>
        <div class="modal-cat" id="modal-cat">Our Story</div>
        <div class="modal-title" id="modal-title">NEXUS — Thirty Years of Vision</div>
      </div>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="vid-wrap">
      <canvas id="vid-canvas"></canvas>
      <div class="sub-wrap"><div id="sub-text"></div></div>
    </div>
    <div class="vid-ctrls">
      <div class="prog-track" id="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
      <div class="ctrl-row">
        <button class="ctrl-btn" id="v-prev">⏮</button>
        <button class="ctrl-btn" id="v-play">▶</button>
        <button class="ctrl-btn" id="v-next">⏭</button>
        <span class="vid-time" id="v-time">0:00 / 0:00</span>
        <button class="cc-btn on" id="v-cc">CC</button>
      </div>
    </div>
    <div class="chap-row" id="chap-row"></div>
    <div class="modal-footer">
      <div id="modal-desc"></div>
      <div class="modal-stats" id="modal-stats"></div>
    </div>
  </div>
</div>

<!-- 2D Fallback -->
<div id="view2d">
  <div class="v2d-hero">
    <div class="v2d-logo-big">Nexus</div>
    <div class="v2d-logo-line"></div>
    <div class="v2d-tagline">Thirty Years of Vision · Since 1994</div>
  </div>
  <div class="v2d-content">
    <div class="v2d-section-lbl">Welcome Video</div>
    <div class="v2d-vid-wrap">
      <canvas id="v2d-vid-canvas"></canvas>
      <div class="v2d-vid-ctrls">
        <button class="ctrl-btn" id="v2d-play">▶</button>
        <div class="prog-track" id="v2d-prog" style="flex:1;margin:0"><div class="prog-fill" id="v2d-fill"></div></div>
        <span class="vid-time" id="v2d-time">0:00 / 0:30</span>
      </div>
    </div>
    <div class="v2d-section-lbl">Explore Our Story</div>
    <div class="v2d-grid" id="v2d-grid"></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── HOTSPOT DATA ─────────────────────────────────────────────────────────────
const HOTSPOTS = [
  {

    ],

    dur:22, color:'#c9a84c',
    chapters:[{t:'Values',s:0},{t:'Wellbeing',s:10},{t:'Awards',s:18}],
    subs:[
      {s:0,e:7,t:'People are the architecture of everything we build.'},
      {s:7,e:14,t:'Ranked #1 Best Place to Work in Technology for three consecutive years.'},
      {s:14,e:19,t:'Flexible, remote-first culture with 96% employee satisfaction.'},
      {s:19,e:22,t:'We invest in people — because that is where the future lives.'},
    ],
    desc:'Ranked #1 Best Place to Work in Technology for three consecutive years. 96% employee satisfaction. Remote-first, globally connected.',
    stats:['#1 BPTW','96% Satisfaction','18 Languages'],
  },
  {
    id:'H4', pos:[5.5, 1.4, -8.5], title:'Global Reach', cat:'Worldwide',
    dur:26, color:'#c9a84c',
    chapters:[{t:'Americas',s:0},{t:'EMEA',s:9},{t:'APAC',s:18}],
    subs:[
      {s:0,e:8,t:'Americas headquarters in New York. 14 regional offices across North and South America.'},
      {s:8,e:17,t:'European operations center in Zurich, serving 22 countries across EMEA.'},
      {s:17,e:23,t:'APAC headquarters in Singapore — our fastest-growing region at 34% YoY.'},
      {s:23,e:26,t:'One company. One vision. Everywhere.'},
    ],
    desc:'Americas, EMEA, and APAC operations spanning 42 countries with 68 office locations. 24/7 global support across all time zones.',
    stats:['42 Countries','68 Offices','24/7 Support'],
  },
  {
    id:'H5', pos:[0, 1.4, -10.5], title:'Sustainability', cat:'ESG',
    dur:24, color:'#c9a84c',
    chapters:[{t:'Carbon',s:0},{t:'Circular',s:10},{t:'2030',s:18}],
    subs:[
      {s:0,e:7,t:'Carbon-neutral operations since 2021 — three years ahead of plan.'},
      {s:7,e:14,t:'100% renewable energy powering all NEXUS data centers globally.'},
      {s:14,e:20,t:'Circular economy program recovered 4.2M tons of e-waste in 2023.'},
      {s:20,e:24,t:'Net-zero by 2030. The planet is our most important client.'},
    ],
    desc:'Carbon-neutral since 2021. 100% renewable data centers. ESG score 94/100. Committed to net-zero by 2030 with a fully circular supply chain.',
    stats:['Carbon Neutral','100% Renewable','ESG 94/100'],
  },
];

// Welcome screen subtitles
const WELCOME_SUBS = [
  {s:0,  e:6,  t:'Welcome to NEXUS Corporation.'},
  {s:6,  e:12, t:'Where technology meets human ambition.'},
  {s:12, e:18, t:'Thirty years. Forty-two countries. One vision.'},
  {s:18, e:24, t:'Please explore our world.'},
  {s:24, e:30, t:''},
];

// ─── RENDERER ─────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08090e);
scene.fog = new THREE.Fog(0x08090e, 18, 32);

const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 80);
camera.position.set(0, 4, 18);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 2, -4);
controls.minDistance = 3;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.48;
controls.enabled = false; // locked during intro

// ─── LIGHTS ────────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x18192a, 8));

// Warm ceiling spots
function makeSpot(x,y,z,col,intensity,angle=Math.PI/7) {
  const s=new THREE.SpotLight(col,intensity,18,angle,0.45);
  s.position.set(x,y,z); s.castShadow=true;
  s.shadow.mapSize.set(512,512);
  scene.add(s); scene.add(s.target);
  s.target.position.set(x,0,z);
  // ceiling disk
  const disk=new THREE.Mesh(new THREE.CircleGeometry(0.18,24),new THREE.MeshBasicMaterial({color:col}));
  disk.rotation.x=Math.PI/2; disk.position.set(x,y-.01,z);
  scene.add(disk);
  return s;
}
makeSpot(-4,5.9,-4, 0xfff5e0, 2.5);
makeSpot( 4,5.9,-4, 0xfff5e0, 2.5);
makeSpot(-4,5.9,-9, 0xfff5e0, 2.0);
makeSpot( 4,5.9,-9, 0xfff5e0, 2.0);
makeSpot( 0,5.9,-2, 0xfff0d0, 1.8);

// Logo backlight (gold)
const logoLight = new THREE.SpotLight(0xc9a84c, 3, 12, Math.PI/6, 0.5);
logoLight.position.set(0, 5.5, -8);
logoLight.target.position.set(0, 3.8, -11.9);
scene.add(logoLight); scene.add(logoLight.target);

// Screen glow
const screenPt = new THREE.PointLight(0x6080ff, 0.8, 8);
screenPt.position.set(0, 3, -10.5);
scene.add(screenPt);

// ─── MARBLE FLOOR TEXTURE ─────────────────────────────────────────────────────
function makeMarble() {
  const c=document.createElement('canvas'); c.width=1024; c.height=1024;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#12141e'; ctx.fillRect(0,0,1024,1024);
  // veining
  for(let i=0;i<24;i++) {
    const alpha=0.05+Math.random()*.18;
    ctx.strokeStyle=`rgba(${140+Math.random()*60},${150+Math.random()*60},${180+Math.random()*60},${alpha})`;
    ctx.lineWidth=0.4+Math.random()*2.5;
    ctx.beginPath();
    let px=Math.random()*1024, py=0;
    ctx.moveTo(px,py);
    for(let j=0;j<6;j++) {
      const cx1=Math.random()*1024,cy1=j*170+Math.random()*60;
      const cx2=Math.random()*1024,cy2=(j+1)*160;
      px+=(-200+Math.random()*400); py=(j+1)*170;
      ctx.bezierCurveTo(cx1,cy1,cx2,cy2,Math.max(0,Math.min(1024,px)),Math.max(0,Math.min(1024,py)));
    }
    ctx.stroke();
  }
  return new THREE.CanvasTexture(c);
}
const marbleTex=makeMarble();
marbleTex.wrapS=marbleTex.wrapT=THREE.RepeatWrapping;
marbleTex.repeat.set(4,4);

// ─── LOBBY GEOMETRY ───────────────────────────────────────────────────────────
// Floor
const floorMesh=new THREE.Mesh(
  new THREE.PlaneGeometry(22,26),
  new THREE.MeshStandardMaterial({map:marbleTex,roughness:0.2,metalness:0.25,envMapIntensity:0.5})
);
floorMesh.rotation.x=-Math.PI/2; floorMesh.receiveShadow=true;
floorMesh.position.z=-4;
scene.add(floorMesh);

// Ceiling
const ceilingMesh=new THREE.Mesh(
  new THREE.PlaneGeometry(22,26),
  new THREE.MeshStandardMaterial({color:0x0c0e18,roughness:1})
);
ceilingMesh.rotation.x=Math.PI/2;
ceilingMesh.position.set(0,6,-4);
scene.add(ceilingMesh);


// Walls
function makeWall(w,h,x,y,z,ry) {
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
    new THREE.MeshStandardMaterial({color:0x0d0f1a,roughness:0.9,metalness:0.05}));
  m.position.set(x,y,z); m.rotation.y=ry; m.receiveShadow=true;
  scene.add(m);
}
makeWall(22,6, 0,3,-13,0);          // back
makeWall(26,6,-10,3,-4,Math.PI/2);  // left
makeWall(26,6, 10,3,-4,-Math.PI/2); // right

// Gold baseboards
function makeBaseboard(w,x,z,ry) {
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,.05,.04),
    new THREE.MeshStandardMaterial({color:0xc9a84c,metalness:.9,roughness:.3,emissive:0xc9a84c,emissiveIntensity:.06}));
  m.position.set(x,.025,z); m.rotation.y=ry;
  scene.add(m);
}
makeBaseboard(22.1,0,-12.97,0);
makeBaseboard(26.1,-9.97,-4,Math.PI/2);
makeBaseboard(26.1,9.97,-4,Math.PI/2);

// ─── COLUMNS ──────────────────────────────────────────────────────────────────
[[-4,0,-5],[4,0,-5],[-4,0,-10],[4,0,-10]].forEach(([x,,z])=>{
  const col=new THREE.Mesh(new THREE.CylinderGeometry(.22,.25,6,24),
    new THREE.MeshStandardMaterial({color:0x0e1020,metalness:.5,roughness:.4}));
  col.position.set(x,3,z); col.castShadow=true; scene.add(col);
  // gold cap
  const cap=new THREE.Mesh(new THREE.CylinderGeometry(.26,.26,.06,24),
    new THREE.MeshStandardMaterial({color:0xc9a84c,metalness:.9,roughness:.2,emissive:0xc9a84c,emissiveIntensity:.08}));
  cap.position.set(x,.04,z); scene.add(cap);
  const cap2=cap.clone(); cap2.position.set(x,5.97,z); scene.add(cap2);
});

// ─── RECEPTION DESK ──────────────────────────────────────────────────────────

// ─── HOTSPOT MARKERS ─────────────────────────────────────────────────────────
const hotspotObjects=[];
const hitboxes=[];

function makeHotspotMarker(h) {
  const grp=new THREE.Group();
  grp.position.set(...h.pos);
  scene.add(grp);
  const col=new THREE.Color(h.color);

  // Outer ring
  const r1=new THREE.Mesh(new THREE.RingGeometry(.28,.32,40),
    new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.5,side:THREE.DoubleSide}));
  r1.rotation.x=-Math.PI/2; grp.add(r1);

  // Inner ring
  const r2=new THREE.Mesh(new THREE.RingGeometry(.14,.17,40),
    new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.7,side:THREE.DoubleSide}));
  r2.rotation.x=-Math.PI/2; grp.add(r2);

  // Center gem
  const gem=new THREE.Mesh(new THREE.SphereGeometry(.09,16,16),
    new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.7,metalness:.5,roughness:.2}));
  gem.position.y=.12; grp.add(gem);

  // Vertical beam
  const beam=new THREE.Mesh(new THREE.CylinderGeometry(.008,.008,h.pos[1]-.1,8),
    new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.3}));
  beam.position.y=-h.pos[1]/2; grp.add(beam);

  // Glow light
  const pt=new THREE.PointLight(col,.8,3.5);
  pt.position.y=.2; grp.add(pt);

  // Hitbox
  const hit=new THREE.Mesh(new THREE.SphereGeometry(.4,8,8),
    new THREE.MeshBasicMaterial({visible:false}));
  hit.userData.hid=h.id;
  grp.add(hit); hitboxes.push(hit);

  hotspotObjects.push({grp,r1,r2,gem,pt,data:h,r1mat:r1.material,r2mat:r2.material});
}
HOTSPOTS.forEach(makeHotspotMarker);

// ─── RAYCASTING ───────────────────────────────────────────────────────────────
const ray=new THREE.Raycaster();
const mouse=new THREE.Vector2();

canvas.addEventListener('mousemove',e=>{
  if(!controls.enabled) return;
  const r=canvas.getBoundingClientRect();
  mouse.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(hitboxes);
  canvas.style.cursor=hits.length?'pointer':'default';
});

canvas.addEventListener('click',e=>{
  if(!controls.enabled) return;
  const r=canvas.getBoundingClientRect();
  mouse.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(hitboxes);
  if(hits.length){
    const h=HOTSPOTS.find(x=>x.id===hits[0].object.userData.hid);
    if(h) openHotspot(h);
  }
});

let flying=false;
function flyTo(cp,tgt,dur=1.8,cb){
  if(flying)return;
  flying=true; controls.enabled=false;
  const sc=camera.position.clone(), st=controls.target.clone();
  const ec=new THREE.Vector3(...cp), et=new THREE.Vector3(...tgt);
  const proxy={t:0};
  gsap.to(proxy,{t:1,duration:dur,ease:'power3.inOut',
    onUpdate(){camera.position.lerpVectors(sc,ec,proxy.t);controls.target.lerpVectors(st,et,proxy.t);},
    onComplete(){flying=false;controls.enabled=true;if(cb)cb();}
  });
}

// ─── MODAL / VIDEO PLAYER ─────────────────────────────────────────────────────
const modal=document.getElementById('modal');
const vidCanvas=document.getElementById('vid-canvas');
const vidCtx=vidCanvas.getContext('2d');
vidCanvas.width=640; vidCanvas.height=360;

let vidDur=25, vidProg=0, vidPlaying=false, vidRaf=null, vidLast=null;
let ccOn=true, curChap=0, activeHotspot=null;

function getSub(subs, t) {
  return subs.find(s=>t>=s.s&&t<s.e)?.t||'';
}

function fmtT(s){return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`;}

function drawVidFrame(t) {
  if(!activeHotspot)return;
  const h=activeHotspot, ctx=vidCtx, cw=640, ch=360, col=h.color;
  const g=ctx.createLinearGradient(0,0,0,ch);
  g.addColorStop(0,'#05060c'); g.addColorStop(1,'#0a0b16');
  ctx.fillStyle=g; ctx.fillRect(0,0,cw,ch);
  // subtle grid
  ctx.strokeStyle='rgba(201,168,76,0.05)'; ctx.lineWidth=1;
  for(let x=0;x<cw;x+=64){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,ch);ctx.stroke();}
  // scan
  ctx.fillStyle='rgba(201,168,76,0.06)'; ctx.fillRect(0,(t*30)%ch,cw,2);
  // title
  ctx.font='italic 28px Georgia,serif'; ctx.fillStyle='rgba(201,168,76,.95)';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText(h.title, cw/2, ch*.18);
  // category
  ctx.font='600 11px system-ui'; ctx.fillStyle='rgba(201,168,76,0.55)';
  ctx.fillText(h.cat.toUpperCase(), cw/2, ch*.12);
  // divider
  const dw=140*(0.5+Math.sin(t*.7)*.5);
  ctx.fillStyle='rgba(201,168,76,0.4)'; ctx.fillRect(cw/2-dw/2,ch*.35,dw,1);
  // chapter label
  if(h.chapters[curChap]) {
    ctx.font='bold 13px system-ui'; ctx.fillStyle='rgba(201,168,76,0.7)';
    ctx.textBaseline='middle';
    ctx.fillText('▶  '+h.chapters[curChap].t, cw/2, ch*.55);
  }
  // progress arc
  const cx=cw/2, cy=ch*.72, r=28;
  ctx.strokeStyle='rgba(201,168,76,0.15)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle=col; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+(vidProg/vidDur)*Math.PI*2); ctx.stroke();
  ctx.font='bold 11px system-ui'; ctx.fillStyle='rgba(201,168,76,.9)'; ctx.textBaseline='middle';
  ctx.fillText(Math.round((vidProg/vidDur)*100)+'%',cx,cy);
  // progress bar
  ctx.fillStyle='rgba(255,255,255,0.05)'; ctx.fillRect(60,ch-14,cw-120,4);
  ctx.fillStyle=col; ctx.fillRect(60,ch-14,(cw-120)*(vidProg/vidDur),4);
  ctx.font='10px monospace'; ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.textAlign='right';
  ctx.fillText(fmtT(vidProg),cw-60,ch-4);
}

function updateVidUI(){
  const pct=vidDur?(vidProg/vidDur)*100:0;
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('v-time').textContent=`${fmtT(vidProg)} / ${fmtT(vidDur)}`;
  document.getElementById('v-play').textContent=vidPlaying?'⏸':'▶';
  if(activeHotspot){
    const c=activeHotspot.chapters; let ci=0;
    for(let i=0;i<c.length;i++){if(vidProg>=c[i].s)ci=i;}
    curChap=ci;
    document.querySelectorAll('.chap-btn').forEach((el,i)=>el.classList.toggle('active',i===ci));
    document.getElementById('sub-text').textContent=
      ccOn?getSub(activeHotspot.subs,vidProg):'';
  }
}

function playVid(){
  if(!vidPlaying){
    if(vidProg>=vidDur)vidProg=0;
    vidPlaying=true; vidLast=performance.now();
    const tick=now=>{
      if(!vidPlaying)return;
      const dt=(now-vidLast)/1000; vidLast=now;
      vidProg=Math.min(vidProg+dt,vidDur);
      if(vidProg>=vidDur)vidPlaying=false;
      updateVidUI(); vidRaf=requestAnimationFrame(tick);
    };
    vidRaf=requestAnimationFrame(tick);
  }
}
function pauseVid(){vidPlaying=false;}
function stopVid(){vidPlaying=false;vidProg=0;if(vidRaf)cancelAnimationFrame(vidRaf);}
function prevChap(){if(!activeHotspot)return;vidProg=activeHotspot.chapters[Math.max(0,curChap-1)].s;updateVidUI();}
function nextChap(){if(!activeHotspot)return;vidProg=activeHotspot.chapters[Math.min(curChap+1,activeHotspot.chapters.length-1)].s;updateVidUI();}

function openHotspot(h) {
  activeHotspot=h;
  document.getElementById('modal-cat').textContent=h.cat;
  document.getElementById('modal-title').textContent=h.title;
  document.getElementById('modal-desc').textContent=h.desc;
  document.getElementById('modal-stats').innerHTML=h.stats.map(s=>`<div class="stat-pill">${s}</div>`).join('');
  document.getElementById('chap-row').innerHTML=h.chapters.map((c,i)=>`<button class="chap-btn" data-i="${i}">${c.t}</button>`).join('');
  document.querySelectorAll('.chap-btn').forEach(b=>{
    b.addEventListener('click',()=>{vidProg=h.chapters[+b.dataset.i].s;updateVidUI();});
  });
  vidDur=h.dur; vidProg=0; vidPlaying=false;
  updateVidUI();
  modal.classList.add('open');
  // fly near hotspot
  const [hx,hy,hz]=h.pos;
  flyTo([hx+2,hy+1.5,hz+5],[hx,hy,hz],1.6,()=>playVid());
}

function closeModal(){
  modal.classList.remove('open');
  stopVid(); activeHotspot=null;
  flyHome();
}

document.getElementById('modal-close').addEventListener('click',closeModal);
document.getElementById('v-play').addEventListener('click',()=>{vidPlaying?pauseVid():playVid();updateVidUI();});
document.getElementById('v-prev').addEventListener('click',prevChap);
document.getElementById('v-next').addEventListener('click',nextChap);
document.getElementById('v-cc').addEventListener('click',()=>{ccOn=!ccOn;document.getElementById('v-cc').classList.toggle('on',ccOn);updateVidUI();});

const progTrack=document.getElementById('prog-track');

// ─── RENDER LOOP ──────────────────────────────────────────────────────────────
const clock=new THREE.Clock();
let v2dT=0;
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();

  // Welcome screen
  if(welcomePlaying){ welcomeT+=clock.getDelta?0:1/60; }
  welcomeT=t; // use elapsed for consistency
  drawWelcomeScreen(t);

  // Video frame (in modal)
  if(modal.classList.contains('open')&&activeHotspot){
    drawVidFrame(t);
  }

  // 2D video
  if(v2dPlaying){ v2dT+=1/60; drawV2dWelcome(v2dT); }

  // Hotspot animations
  hotspotObjects.forEach((obj,i)=>{
    const st=t*1.8+i*1.3;
    obj.gem.position.y=.12+Math.sin(st)*.06;
    obj.r1mat.opacity=.35+Math.sin(st*1.2)*.2;
    obj.r2mat.opacity=.2+Math.sin(st*.8+1)*.15;
    obj.r1.scale.setScalar(1+Math.sin(st*.9)*.07);
    obj.r2.scale.setScalar(1+Math.sin(st*.7+.5)*.12);
    obj.pt.intensity=.6+Math.sin(st*1.4)*.3;
  });

  // Screen glow pulse
  screenPt.intensity=.7+Math.sin(t*1.2)*.2;

  updateLabels();
  controls.update();
  renderer.render(scene,camera);
}
animate();

// ─── KEYBOARD ─────────────────────────────────────────────────────────────────
window.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if(e.key===' '){e.preventDefault();vidPlaying?pauseVid():playVid();updateVidUI();}
  if(e.key==='ArrowRight')nextChap();
  if(e.key==='ArrowLeft')prevChap();
});
</script>
</body>
</html>
