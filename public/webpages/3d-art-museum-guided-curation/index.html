<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Art Museum — Guided Curation & Video Projections</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="scene-root"></div>

  <main class="ui">
    <header class="top glass">
      <div>
        <p class="eyebrow">Art Museum 3D</p>
        <h1>Guided Curation &amp; Video Projections</h1>
      </div>
      <div class="actions">
        <button id="curator-mode" class="btn primary">Iniciar curaduría</button>
        <button id="search-btn" class="btn">Buscar</button>
        <button id="favorites-toggle" class="btn">Favoritos</button>
        <button id="fallback-toggle" class="btn">Fallback 2D</button>
      </div>
    </header>

    <div id="search-bar" class="search-bar glass hidden" role="search">
      <input type="search" id="search-input" placeholder="Buscar obras por título, artista, técnica…" aria-label="Search artworks">
      <div id="search-results" class="search-results"></div>
    </div>

    <section class="panel glass">
      <h2>Obras en sala</h2>
      <div class="row" id="artwork-buttons">
        <button class="btn art-btn" data-art="0">Retrato en azul</button>
        <button class="btn art-btn" data-art="1">Composición_#7</button>
        <button class="btn art-btn" data-art="2">Horizonte líquido</button>
        <button class="btn art-btn" data-art="3">Geometría sagrada</button>
      </div>
      <p id="art-copy" class="copy">Selecciona una obra o activa la curaduría guiada para un recorrido con video, voz y transiciones.</p>
      <div id="curator-info" class="curator-info"></div>
    </section>

    <section id="fallback" class="fallback glass hidden" aria-label="2D fallback with artworks and curatorial videos"></section>
  </main>

  <div id="dialog" class="dialog hidden" role="dialog" aria-modal="true" aria-label="Artwork curatorial video and metadata">
    <article class="dialog-card">
      <button id="close-dialog" class="btn close">✕</button>
      <h3 id="dialog-title"></h3>
      <div class="dialog-video-wrap">
        <video id="dialog-video" controls preload="metadata" crossorigin="anonymous">
          <track kind="captions" srclang="en" label="English" src="assets/subtitles-en.srt" default>
        </video>
      </div>
      <div class="dialog-body">
        <p id="dialog-desc" class="desc"></p>
        <div class="dialog-meta" id="dialog-meta"></div>
        <div class="dialog-actions">
          <button id="fav-toggle" class="btn">♡ Favorito</button>
          <a class="download" href="assets/catalogo.pdf" download>📄 Catálogo PDF</a>
          <a class="download" href="assets/transcript.txt" download>📝 Transcripción</a>
        </div>
        <div class="personal-note">
          <textarea id="note-input" rows="2" placeholder="Nota personal sobre esta obra…"></textarea>
          <button id="save-note" class="btn primary">Guardar nota</button>
        </div>
      </div>
    </article>
  </div>

  <div id="favorites-panel" class="fav-panel glass hidden" role="dialog" aria-label="Your favorite artworks">
    <h3>Favoritos</h3>
    <div id="fav-list" class="fav-list"></div>
    <button id="close-fav" class="btn close">Cerrar</button>
  </div>

  <script type="module" src="museum.js"></script>
</body>
</html>
