<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>3D Product Showroom — Corporate Demo Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04080f;--surf:#0c1422;--surf2:#142040;--bdr:#1a2e55;
  --txt:#dde8f5;--muted:#5a7090;--accent:#4f9cf9;
  --ff:'Inter',system-ui,sans-serif;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--ff);-webkit-font-smoothing:antialiased}
#c{position:fixed;top:0;left:0;display:block;width:100%;height:100%}

/* NAV */
#nav{position:fixed;top:0;left:0;right:0;height:56px;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(4,8,15,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--bdr)}
.brand{display:flex;align-items:center;gap:10px;font-size:.9rem;font-weight:600}
.brand-icon{color:var(--accent);font-size:1.3rem}
.badge{background:rgba(79,156,249,.1);border:1px solid rgba(79,156,249,.25);color:var(--accent);font-size:.65rem;font-weight:600;padding:2px 8px;border-radius:99px;letter-spacing:.04em;text-transform:uppercase}
.nav-right{display:flex;align-items:center;gap:12px}
.btn-nav{background:transparent;border:1px solid var(--bdr);color:var(--muted);padding:6px 14px;border-radius:6px;font-size:.75rem;cursor:pointer;transition:border-color .2s,color .2s}
.btn-nav:hover{border-color:var(--accent);color:var(--txt)}
.hint-txt{font-size:.72rem;color:var(--muted)}
@media(max-width:640px){.hint-txt{display:none}}

/* HOVER TOOLTIP */
#tooltip{position:fixed;pointer-events:none;z-index:90;background:rgba(12,20,34,.96);border:1px solid var(--bdr);border-radius:8px;padding:8px 12px;opacity:0;transition:opacity .15s;transform:translate(-50%,-120%);white-space:nowrap}
#tooltip.show{opacity:1}
.tt-name{font-size:.8rem;font-weight:600}
.tt-tag{font-size:.7rem;color:var(--muted);margin-top:2px}

/* DETAIL PANEL */
#panel{position:fixed;right:0;top:0;bottom:0;width:375px;background:rgba(12,20,34,.98);border-left:1px solid var(--bdr);z-index:200;display:flex;flex-direction:column;transform:translateX(375px);transition:transform .4s cubic-bezier(.4,0,.2,1);overflow-y:auto}
#panel.open{transform:translateX(0)}
.ph{padding:18px 20px 0;flex-shrink:0}
.ph-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}
.ph-badge{font-size:.65rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:99px;flex-shrink:0}
.ph-close{background:var(--surf2);border:1px solid var(--bdr);color:var(--muted);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.75rem;flex-shrink:0;transition:color .2s}
.ph-close:hover{color:var(--txt)}
.ph-title{font-size:1.05rem;font-weight:700;margin-bottom:4px}
.ph-tagline{font-size:.78rem;color:var(--muted);margin-bottom:10px}
.ph-desc{font-size:.77rem;color:var(--muted);line-height:1.65;margin:0 20px 14px}

/* MOCK VIDEO PLAYER */
.player{margin:0 20px 14px;background:var(--surf2);border:1px solid var(--bdr);border-radius:10px;overflow:hidden}
.player-screen{height:130px;position:relative;cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:center}
.player-bg{position:absolute;inset:0;transition:background .5s}
.player-bar{position:absolute;bottom:0;left:0;height:2px;background:var(--accent);width:0%;transition:width .08s}
.ch-ov{position:absolute;top:0;left:0;right:0;padding:8px 12px;font-size:.7rem;font-weight:600;letter-spacing:.04em;opacity:0;transition:opacity .3s;text-transform:uppercase}
.ch-ov.show{opacity:1}
.play-btn{position:relative;z-index:2;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);color:#fff;font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.play-btn:hover{background:rgba(255,255,255,.2)}
.player-ctrl{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.prog-wrap{height:20px;display:flex;align-items:center;cursor:pointer;position:relative}
.prog-track{width:100%;height:3px;background:var(--bdr);border-radius:2px;position:relative}
.prog-fill{height:100%;border-radius:2px;background:var(--accent);width:0%;transition:width .05s}
.prog-handle{position:absolute;top:50%;left:0%;transform:translate(-50%,-50%);width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 0 5px rgba(0,0,0,.4);transition:left .05s;pointer-events:none}
.ch-pip{position:absolute;top:50%;transform:translate(-50%,-50%);width:2px;height:8px;border-radius:1px;background:rgba(255,255,255,.3)}
.ctrl-row{display:flex;align-items:center;justify-content:space-between}
.ctrl-time{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ctrl-lbl{font-size:.7rem;color:var(--muted)}

/* CHAPTERS */
.section{padding:0 20px 12px}
.sec-lbl{font-size:.68rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.ch-item{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:7px;cursor:pointer;transition:background .15s;border:1px solid transparent;margin-bottom:3px}
.ch-item:hover,.ch-item.active{background:var(--surf2)}
.ch-item.active{border-color:var(--bdr)}
.ch-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.ch-info{flex:1;min-width:0}
.ch-label{font-size:.77rem;font-weight:500}
.ch-sub{font-size:.67rem;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-ts{font-size:.67rem;color:var(--muted);flex-shrink:0}

/* SPECS */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.chip{background:var(--surf2);border:1px solid var(--bdr);border-radius:5px;padding:4px 9px;font-size:.68rem;font-weight:500}
.int-chip{background:var(--surf2);border:1px solid var(--bdr);border-radius:5px;padding:4px 9px;font-size:.68rem;color:var(--muted)}

/* CTAS */
.panel-ctas{padding:10px 20px 20px;display:flex;gap:8px;margin-top:auto;flex-shrink:0}
.cta-p{flex:1;background:var(--accent);color:#fff;border:none;padding:10px;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;transition:opacity .2s}
.cta-p:hover{opacity:.85}
.cta-s{flex:1;background:transparent;border:1px solid var(--bdr);color:var(--txt);padding:10px;border-radius:8px;font-size:.8rem;cursor:pointer;transition:border-color .2s}
.cta-s:hover{border-color:var(--muted)}

/* 2D FALLBACK */
#fallback{position:fixed;inset:0;background:rgba(4,8,15,.98);z-index:300;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .3s;padding:76px 20px 24px}
#fallback.show{opacity:1;pointer-events:all}
.fb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;max-width:980px;margin:0 auto}
.fb-card{background:var(--surf);border:1px solid var(--bdr);border-radius:12px;overflow:hidden}
.fb-thumb{height:120px;display:flex;align-items:center;justify-content:center;font-size:2.5rem}
.fb-body{padding:16px}
.fb-name{font-size:.9rem;font-weight:600;margin-bottom:3px}
.fb-cat{font-size:.7rem;margin-bottom:8px;font-weight:500}
.fb-desc{font-size:.74rem;color:var(--muted);line-height:1.6;margin-bottom:10px}
.fb-btn{position:fixed;top:16px;right:16px;background:var(--surf2);border:1px solid var(--bdr);color:var(--txt);padding:7px 14px;border-radius:7px;cursor:pointer;font-size:.78rem;z-index:301}

/* KEYBOARD HINT */
#kh{position:fixed;bottom:20px;left:20px;z-index:100}
.kr{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.kr span{font-size:.68rem;color:var(--muted)}
kbd{background:var(--surf2);border:1px solid var(--bdr);border-radius:3px;padding:1px 5px;font-size:.68rem;color:var(--txt)}

@media(prefers-reduced-motion:reduce){#panel,#fallback{transition:none}}
@media(max-width:680px){#panel{width:100%;top:auto;height:65vh;transform:translateY(100%);border-left:none;border-top:1px solid var(--bdr)}#panel.open{transform:translateY(0)}}
</style>
</head>
<body>
<canvas id="c" aria-label="3D product showroom. Click a showcase to open its demo. Use keys 1-3 to navigate."></canvas>

<nav id="nav">
  <div class="brand">
    <span class="brand-icon">&#9670;</span>
    <span>DemoRoom <span class="badge">Corporate Suite</span></span>
  </div>
  <div class="nav-right">
    <span class="hint-txt" aria-hidden="true">Hover · preview &nbsp;&bull;&nbsp; Click · demo</span>
    <button id="btn2d" class="btn-nav" aria-label="View 2D product gallery">2D Gallery</button>
  </div>
</nav>

<div id="tooltip" aria-hidden="true">
  <div class="tt-name" id="tt-name"></div>
  <div class="tt-tag" id="tt-tag"></div>
</div>

<aside id="panel" role="dialog" aria-modal="true" aria-labelledby="ph-title-el">
  <div class="ph">
    <div class="ph-top">
      <div class="ph-badge" id="ph-badge"></div>
      <button class="ph-close" id="ph-close" aria-label="Close panel">&#10005;</button>
    </div>
    <div class="ph-title" id="ph-title-el"></div>
    <div class="ph-tagline" id="ph-tagline"></div>
  </div>
  <p class="ph-desc" id="ph-desc"></p>

  <div class="player">
    <div class="player-screen" id="player-screen">
      <div class="player-bg" id="player-bg"></div>
      <div class="player-bar" id="player-bar"></div>
      <div class="ch-ov" id="ch-ov"></div>
      <button class="play-btn" id="play-btn" aria-label="Play case study video">&#9654;</button>
    </div>
    <div class="player-ctrl">
      <div class="prog-wrap" id="prog-wrap" role="slider" aria-label="Video progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="prog-track" id="prog-track">
          <div class="prog-fill" id="prog-fill"></div>
          <div class="prog-handle" id="prog-handle"></div>
        </div>
      </div>
      <div class="ctrl-row">
        <span class="ctrl-time" id="ctrl-time">0:00 / 1:18</span>
        <span class="ctrl-lbl" id="ctrl-lbl"></span>
      </div>
    </div>
  </div>

  <div class="section" id="chapters-section"></div>
  <div class="section" id="specs-section"></div>
  <div class="panel-ctas">
    <button class="cta-p" id="cta-p">Request Demo</button>
    <button class="cta-s">Download PDF</button>
  </div>
</aside>

<div id="fallback" aria-label="2D product gallery">
  <button class="fb-btn" id="fb-close">&#10005; Back to 3D</button>
  <div class="fb-grid" id="fb-grid"></div>
</div>

<div id="kh" aria-hidden="true">
  <div class="kr"><kbd>1</kbd><span>DataPulse</span></div>
  <div class="kr"><kbd>2</kbd><span>NexusCloud</span></div>
  <div class="kr"><kbd>3</kbd><span>SynthAI</span></div>
  <div class="kr"><kbd>Esc</kbd><span>Overview</span></div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const g = window.gsap;
const RM = matchMedia('(prefers-reduced-motion:reduce)').matches;

// ── RENDERER ─────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const R = new THREE.WebGLRenderer({ canvas, antialias: true });
R.setPixelRatio(Math.min(devicePixelRatio, 2));
R.setSize(innerWidth, innerHeight);
R.shadowMap.enabled = true;
R.toneMapping = THREE.ACESFilmicToneMapping;
R.toneMappingExposure = 0.9;
R.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04080f);
scene.fog = new THREE.Fog(0x04080f, 22, 50);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 120);
camera.position.set(0, 5, 13);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 5;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI / 2.1;
controls.update();

// ── LIGHTS ───────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x1a2a5a, 3.5));
const sun = new THREE.DirectionalLight(0xd0e8ff, 2);
sun.position.set(8, 18, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x304080, 0.6);
fill.position.set(-8, 4, -6);
scene.add(fill);

// ── ENVIRONMENT ──────────────────────────────────────────────────────────────
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 100),
  new THREE.MeshStandardMaterial({ color: 0x050910, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(60, 60, 0x112030, 0x0b1828);
grid.position.y = 0.01;
scene.add(grid);

// ── PRODUCT DATA ─────────────────────────────────────────────────────────────
const PRODUCTS = [
  {
    id: 'analytics', name: 'DataPulse Analytics', tagline: 'Real-time business intelligence',
    category: 'Analytics', col: 0x4f9cf9, hex: '#4f9cf9', icon: '📊', px: -5.5,
    specs: ['REST API', 'GraphQL', 'WebSocket', '99.9% SLA', '<100ms latency'],
    integrations: ['Salesforce', 'HubSpot', 'Slack', 'BigQuery'],
    desc: 'Enterprise analytics platform processing 50M events/day with sub-100ms query latency, live dashboards, and predictive forecasting.',
    dur: 78, durFmt: '1:18',
    chapters: [
      { p: 0,    l: 'Overview',      s: 'Platform introduction & capabilities', t: '0:00' },
      { p: 0.25, l: 'Data Pipeline', s: 'Real-time ingestion architecture',     t: '0:19' },
      { p: 0.55, l: 'Live Dashboard',s: 'Interactive visualization demo',       t: '0:43' },
      { p: 0.82, l: 'ROI Results',   s: '3.2x efficiency gain demonstrated',    t: '1:04' }
    ]
  },
  {
    id: 'cloud', name: 'NexusCloud API Suite', tagline: 'Unified multi-cloud infrastructure',
    category: 'Infrastructure', col: 0x34d399, hex: '#34d399', icon: '☁', px: 0,
    specs: ['Kubernetes', 'Multi-cloud', 'Auto-scaling', 'Zero-downtime', 'GitOps'],
    integrations: ['AWS', 'GCP', 'Azure', 'Terraform'],
    desc: 'Deploy and manage infrastructure across any cloud provider through a single unified API. Zero to production in minutes, not months.',
    dur: 65, durFmt: '1:05',
    chapters: [
      { p: 0,    l: 'Architecture', s: 'Multi-cloud deployment overview',   t: '0:00' },
      { p: 0.3,  l: 'API Demo',     s: 'One-command deploy to any provider', t: '0:19' },
      { p: 0.6,  l: 'Auto-scaling', s: '0 to 100k req/s demonstrated',      t: '0:39' },
      { p: 0.82, l: 'Observability',s: 'Built-in monitoring & alerting',     t: '0:53' }
    ]
  },
  {
    id: 'ai', name: 'SynthAI Hub', tagline: 'AI orchestration & deployment',
    category: 'AI / ML', col: 0xf59e0b, hex: '#f59e0b', icon: '✦', px: 5.5,
    specs: ['LLM APIs', 'Vector DB', 'RAG Pipeline', 'Fine-tuning', 'Observability'],
    integrations: ['OpenAI', 'Anthropic', 'HuggingFace', 'Pinecone'],
    desc: 'End-to-end AI pipeline from prompt to production. Orchestrate 50+ models, build RAG systems, and monitor everything in one place.',
    dur: 90, durFmt: '1:30',
    chapters: [
      { p: 0,    l: 'Model Hub',    s: 'Unified access to 50+ AI models', t: '0:00' },
      { p: 0.28, l: 'Orchestration',s: 'Visual chain builder demo',        t: '0:25' },
      { p: 0.58, l: 'RAG Pipeline', s: 'Knowledge base integration',       t: '0:52' },
      { p: 0.82, l: 'Production',   s: 'Deploy & monitor in one click',    t: '1:13' }
    ]
  }
];

// ── PRODUCT MODELS ────────────────────────────────────────────────────────────
function buildAnalytics(p) {
  const grp = new THREE.Group();
  const screenMat = new THREE.MeshStandardMaterial({ color: 0x09142a, roughness: 0.2, metalness: 0.5 });
  const screen = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.0, 0.06), screenMat);
  screen.position.y = 0.62;
  grp.add(screen);
  const edgeGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(1.62, 1.02, 0.08));
  const edgeLine = new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({ color: p.col, transparent: true, opacity: 0.5 }));
  edgeLine.position.y = 0.62;
  grp.add(edgeLine);
  const barCols = [p.col, 0x34d399, 0xf59e0b, 0xe74c3c, 0xa78bfa];
  const baseHArr = [0.25, 0.45, 0.35, 0.55, 0.4];
  const bars = [];
  for (let i = 0; i < 5; i++) {
    const bh = baseHArr[i];
    const barMat = new THREE.MeshStandardMaterial({ color: barCols[i], emissive: barCols[i], emissiveIntensity: 0.4 });
    const bar = new THREE.Mesh(new THREE.BoxGeometry(0.18, bh, 0.02), barMat);
    const barBase = 0.17;
    bar.position.set(-0.42 + i * 0.21, barBase + bh / 2, 0.04);
    grp.add(bar);
    bars.push({ mesh: bar, baseH: bh, bottom: barBase });
  }
  const stand = new THREE.Mesh(
    new THREE.CylinderGeometry(0.06, 0.14, 0.5, 8),
    new THREE.MeshStandardMaterial({ color: 0x1a2a4a, metalness: 0.7 })
  );
  stand.position.y = -0.22;
  grp.add(stand);
  p._bars = bars;
  p._edgeLine = edgeLine;
  return grp;
}

function buildCloud(p) {
  const grp = new THREE.Group();
  const hubY = 0.7;
  const hub = new THREE.Mesh(
    new THREE.SphereGeometry(0.22, 20, 20),
    new THREE.MeshStandardMaterial({ color: p.col, emissive: p.col, emissiveIntensity: 0.25, roughness: 0.2 })
  );
  hub.position.y = hubY;
  grp.add(hub);
  const nodeData = [0, Math.PI / 2, Math.PI, (3 * Math.PI) / 2].map(angle => {
    const r = 0.62;
    const node = new THREE.Mesh(
      new THREE.SphereGeometry(0.1, 12, 12),
      new THREE.MeshStandardMaterial({ color: p.col, emissive: p.col, emissiveIntensity: 0.12 })
    );
    node.position.set(Math.cos(angle) * r, hubY, Math.sin(angle) * r);
    grp.add(node);
    return { mesh: node, angle, r };
  });
  const outerRing = new THREE.Mesh(
    new THREE.TorusGeometry(0.75, 0.014, 8, 40),
    new THREE.MeshBasicMaterial({ color: p.col, transparent: true, opacity: 0.3 })
  );
  outerRing.position.y = hubY;
  grp.add(outerRing);
  p._hub = hub;
  p._nodes = nodeData;
  p._outerRing = outerRing;
  return grp;
}

function buildAI(p) {
  const grp = new THREE.Group();
  const octY = 0.7;
  const oct = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.38, 0),
    new THREE.MeshStandardMaterial({ color: p.col, emissive: p.col, emissiveIntensity: 0.25, roughness: 0.1, metalness: 0.5 })
  );
  oct.position.y = octY;
  grp.add(oct);
  const wireGeo = new THREE.WireframeGeometry(new THREE.OctahedronGeometry(0.4, 0));
  const wire = new THREE.LineSegments(wireGeo, new THREE.LineBasicMaterial({ color: p.col, transparent: true, opacity: 0.55 }));
  wire.position.y = octY;
  grp.add(wire);
  const r1 = new THREE.Mesh(
    new THREE.TorusGeometry(0.55, 0.012, 8, 32),
    new THREE.MeshBasicMaterial({ color: p.col, transparent: true, opacity: 0.4 })
  );
  r1.position.y = octY;
  r1.rotation.x = Math.PI / 4;
  grp.add(r1);
  const r2 = new THREE.Mesh(
    new THREE.TorusGeometry(0.7, 0.012, 8, 32),
    new THREE.MeshBasicMaterial({ color: p.col, transparent: true, opacity: 0.22 })
  );
  r2.position.y = octY;
  r2.rotation.x = -Math.PI / 3;
  r2.rotation.z = Math.PI / 5;
  grp.add(r2);
  p._oct = oct;
  p._wire = wire;
  p._r1 = r1;
  p._r2 = r2;
  return grp;
}

// ── SHOWCASE BUILDER ─────────────────────────────────────────────────────────
const clickables = [];

PRODUCTS.forEach(p => {
  const grp = new THREE.Group();
  grp.position.set(p.px, 0, 0);

  // Pedestal
  const ped = new THREE.Mesh(
    new THREE.CylinderGeometry(1.1, 1.3, 0.4, 6),
    new THREE.MeshStandardMaterial({ color: 0x0e1a30, roughness: 0.3, metalness: 0.7 })
  );
  ped.position.y = 0.2;
  ped.castShadow = true;
  grp.add(ped);

  // Accent ring on top of pedestal
  const accentRing = new THREE.Mesh(
    new THREE.TorusGeometry(1.12, 0.03, 8, 30),
    new THREE.MeshBasicMaterial({ color: p.col, transparent: true, opacity: 0.45 })
  );
  accentRing.position.y = 0.42;
  accentRing.rotation.x = Math.PI / 2;
  grp.add(accentRing);

  // Glass showcase walls
  const wallH = 2.1, wallW = 2.0, wallT = 0.04;
  const wallConfigs = [
    { pos: [0, wallH / 2 + 0.42, wallW / 2],  size: [wallW, wallH, wallT] },  // front
    { pos: [0, wallH / 2 + 0.42, -wallW / 2], size: [wallW, wallH, wallT] },  // back
    { pos: [-wallW / 2, wallH / 2 + 0.42, 0], size: [wallT, wallH, wallW] },  // left
    { pos: [wallW / 2, wallH / 2 + 0.42, 0],  size: [wallT, wallH, wallW] },  // right
    { pos: [0, wallH + 0.44, 0], size: [wallW, wallT, wallW] }                 // ceiling
  ];
  const wallOpenDirs = [
    [0, 0, 0.9], [0, 0, -0.9], [-0.9, 0, 0], [0.9, 0, 0], [0, 1.1, 0]
  ];
  const walls = [];
  wallConfigs.forEach(({ pos, size }, wi) => {
    const wm = new THREE.Mesh(
      new THREE.BoxGeometry(...size),
      new THREE.MeshStandardMaterial({ color: 0x8abcf5, transparent: true, opacity: 0.12, roughness: 0, metalness: 0.1 })
    );
    wm.position.set(...pos);
    wm._basePos = wm.position.clone();
    wm._openDir = wallOpenDirs[wi];
    // Edge lines as children so they move with the wall
    const edgeGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(...size));
    const edgeLine = new THREE.LineSegments(
      edgeGeo,
      new THREE.LineBasicMaterial({ color: p.col, transparent: true, opacity: 0.22 })
    );
    wm.add(edgeLine);
    wm._edge = edgeLine;
    grp.add(wm);
    walls.push(wm);
  });
  p._walls = walls;

  // Product model
  let model;
  if (p.id === 'analytics') model = buildAnalytics(p);
  else if (p.id === 'cloud') model = buildCloud(p);
  else model = buildAI(p);
  model.position.y = 0.42;
  grp.add(model);
  p._model = model;

  // Interior point light
  const pt = new THREE.PointLight(p.col, 2.5, 5.5);
  pt.position.set(0, 1.8, 0);
  grp.add(pt);
  p._pt = pt;

  // Invisible click hitbox
  const hb = new THREE.Mesh(
    new THREE.BoxGeometry(2.3, 3.1, 2.3),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  hb.position.y = 1.5;
  hb.userData.pid = p.id;
  clickables.push(hb);
  grp.add(hb);

  scene.add(grp);
  p._grp = grp;
  p._open = false;
});

// ── CAMERA / FLY-TO ──────────────────────────────────────────────────────────
const OVP = new THREE.Vector3(0, 5, 13);
const OVT = new THREE.Vector3(0, 1.5, 0);
let animating = false;
let activeProduct = null;

function flyTo(tp, tt, dur, cb) {
  if (RM) { camera.position.copy(tp); controls.target.copy(tt); controls.update(); cb && cb(); return; }
  animating = true;
  controls.enabled = false;
  const sp = camera.position.clone(), st = controls.target.clone();
  const proxy = { t: 0 };
  g.to(proxy, {
    t: 1, duration: dur || 1.3, ease: 'power2.inOut',
    onUpdate() { camera.position.lerpVectors(sp, tp, proxy.t); controls.target.lerpVectors(st, tt, proxy.t); controls.update(); },
    onComplete() { animating = false; controls.enabled = true; cb && cb(); }
  });
}

// ── CASE OPEN / CLOSE ────────────────────────────────────────────────────────
function openCase(p) {
  if (p._open) return;
  p._open = true;
  p._walls.forEach(w => {
    if (!RM) {
      g.to(w.position, { x: w._basePos.x + w._openDir[0], y: w._basePos.y + w._openDir[1], z: w._basePos.z + w._openDir[2], duration: 0.55, ease: 'power2.out' });
      g.to(w.material, { opacity: 0.03, duration: 0.35 });
      g.to(w._edge.material, { opacity: 0.55, duration: 0.4 });
    } else { w.material.opacity = 0.03; }
  });
  if (!RM) {
    g.to(p._pt, { intensity: 5.5, duration: 0.4 });
    g.to(p._model.scale, { x: 1.1, y: 1.1, z: 1.1, duration: 0.5, ease: 'back.out(1.4)' });
  }
}

function closeCase(p) {
  if (!p._open) return;
  p._open = false;
  p._walls.forEach(w => {
    if (!RM) {
      g.to(w.position, { x: w._basePos.x, y: w._basePos.y, z: w._basePos.z, duration: 0.45, ease: 'power2.inOut' });
      g.to(w.material, { opacity: 0.12, duration: 0.35 });
      g.to(w._edge.material, { opacity: 0.22, duration: 0.35 });
    } else { w.material.opacity = 0.12; }
  });
  if (!RM) {
    g.to(p._pt, { intensity: 2.5, duration: 0.3 });
    g.to(p._model.scale, { x: 1, y: 1, z: 1, duration: 0.4 });
  } else { p._model.scale.set(1, 1, 1); }
}

// ── VIDEO PLAYER STATE ───────────────────────────────────────────────────────
let vidProg = 0;
let vidPlaying = false;
let vidStartTs = null;
let vidRaf = null;

function fmtTime(secs) {
  const m = Math.floor(secs / 60), s = Math.floor(secs % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function updateVideoUI(prog, p) {
  vidProg = Math.max(0, Math.min(1, prog));
  const pct = vidProg * 100;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-handle').style.left = pct + '%';
  document.getElementById('player-bar').style.width = pct + '%';
  document.getElementById('prog-wrap').setAttribute('aria-valuenow', Math.round(pct));
  document.getElementById('ctrl-time').textContent = fmtTime(vidProg * p.dur) + ' / ' + p.durFmt;

  // Chapter highlight
  let ci = 0;
  p.chapters.forEach((ch, i) => { if (vidProg >= ch.p) ci = i; });
  p.chapters.forEach((_, i) => {
    const el = document.getElementById('chi-' + i);
    if (el) el.className = 'ch-item' + (i === ci ? ' active' : '');
  });
  const ch = p.chapters[ci];
  document.getElementById('ctrl-lbl').textContent = ch ? ch.l : '';
  const ov = document.getElementById('ch-ov');
  ov.textContent = ch ? ch.l : '';
  ov.className = 'ch-ov show';

  // Background gradient per progress
  const hue = 200 + vidProg * 70;
  document.getElementById('player-bg').style.background =
    `linear-gradient(135deg, hsl(${hue},40%,7%), hsl(${hue + 25},55%,14%))`;
}

function tickVideo(now) {
  if (!vidPlaying || !activeProduct) return;
  if (!vidStartTs) vidStartTs = now - vidProg * activeProduct.dur * 1000;
  const elapsed = (now - vidStartTs) / 1000;
  const prog = elapsed / activeProduct.dur;
  if (prog >= 1) {
    updateVideoUI(1, activeProduct);
    vidPlaying = false;
    document.getElementById('play-btn').innerHTML = '&#9654;';
    return;
  }
  updateVideoUI(prog, activeProduct);
  vidRaf = requestAnimationFrame(tickVideo);
}

document.getElementById('play-btn').addEventListener('click', () => {
  if (!activeProduct) return;
  vidPlaying = !vidPlaying;
  document.getElementById('play-btn').innerHTML = vidPlaying ? '&#9646;&#9646;' : '&#9654;';
  if (vidPlaying) {
    vidStartTs = performance.now() - vidProg * activeProduct.dur * 1000;
    vidRaf = requestAnimationFrame(tickVideo);
  } else {
    cancelAnimationFrame(vidRaf);
  }
});

// Progress bar scrubbing
const progWrap = document.getElementById('prog-wrap');
let scrubbing = false;

function scrubAt(cx) {
  if (!activeProduct) return;
  const rect = progWrap.getBoundingClientRect();
  const p = Math.max(0, Math.min(1, (cx - rect.left) / rect.width));
  vidStartTs = null;
  updateVideoUI(p, activeProduct);
}
progWrap.addEventListener('mousedown', e => { scrubbing = true; scrubAt(e.clientX); });
window.addEventListener('mousemove', e => { if (scrubbing) scrubAt(e.clientX); });
window.addEventListener('mouseup', () => { scrubbing = false; });
progWrap.addEventListener('touchstart', e => { scrubbing = true; scrubAt(e.touches[0].clientX); }, { passive: true });
window.addEventListener('touchmove', e => { if (scrubbing) scrubAt(e.touches[0].clientX); }, { passive: true });
window.addEventListener('touchend', () => { scrubbing = false; });

// ── SELECT PRODUCT ────────────────────────────────────────────────────────────
function selectProduct(p) {
  if (activeProduct && activeProduct !== p) { closeCase(activeProduct); }
  activeProduct = p;
  openCase(p);
  flyTo(new THREE.Vector3(p.px, 4.5, 9), new THREE.Vector3(p.px, 1.5, 0), 1.3, null);

  // Populate panel
  document.getElementById('ph-badge').textContent = p.category;
  document.getElementById('ph-badge').style.cssText = `background:${p.hex}18;border:1px solid ${p.hex}44;color:${p.hex}`;
  document.getElementById('ph-title-el').textContent = p.name;
  document.getElementById('ph-tagline').textContent = p.tagline;
  document.getElementById('ph-desc').textContent = p.desc;
  document.getElementById('ctrl-time').textContent = '0:00 / ' + p.durFmt;
  document.getElementById('cta-p').style.background = p.hex;
  document.getElementById('prog-fill').style.background = p.hex;

  // Chapter pips + list
  const track = document.getElementById('prog-track');
  track.querySelectorAll('.ch-pip').forEach(el => el.remove());
  const cs = document.getElementById('chapters-section');
  cs.innerHTML = '<div class="sec-lbl">Chapters</div>';
  p.chapters.forEach((ch, i) => {
    if (i > 0) {
      const pip = document.createElement('div');
      pip.className = 'ch-pip';
      pip.style.left = ch.p * 100 + '%';
      track.appendChild(pip);
    }
    const el = document.createElement('div');
    el.className = 'ch-item' + (i === 0 ? ' active' : '');
    el.id = 'chi-' + i;
    el.innerHTML = `<div class="ch-dot" style="background:${p.hex}"></div><div class="ch-info"><div class="ch-label">${ch.l}</div><div class="ch-sub">${ch.s}</div></div><div class="ch-ts">${ch.t}</div>`;
    el.addEventListener('click', () => { vidStartTs = null; updateVideoUI(ch.p, p); });
    cs.appendChild(el);
  });

  // Specs
  const ss = document.getElementById('specs-section');
  ss.innerHTML = `<div class="sec-lbl">Capabilities</div><div class="chips">${p.specs.map(s => `<div class="chip">${s}</div>`).join('')}</div><div class="sec-lbl" style="margin-top:8px">Integrations</div><div class="chips">${p.integrations.map(s => `<div class="int-chip">${s}</div>`).join('')}</div>`;

  // Reset video
  vidProg = 0; vidPlaying = false; vidStartTs = null;
  cancelAnimationFrame(vidRaf);
  document.getElementById('play-btn').innerHTML = '&#9654;';
  updateVideoUI(0, p);

  document.getElementById('panel').classList.add('open');
}

function deselect() {
  if (activeProduct) { closeCase(activeProduct); activeProduct = null; }
  vidPlaying = false;
  cancelAnimationFrame(vidRaf);
  document.getElementById('panel').classList.remove('open');
  flyTo(OVP, OVT, 1.2, null);
}

document.getElementById('ph-close').addEventListener('click', deselect);

// ── 2D FALLBACK ──────────────────────────────────────────────────────────────
const fbGrid = document.getElementById('fb-grid');
PRODUCTS.forEach(p => {
  const card = document.createElement('div');
  card.className = 'fb-card';
  card.innerHTML = `
    <div class="fb-thumb" style="background:linear-gradient(135deg,${p.hex}22,${p.hex}08)">${p.icon}</div>
    <div class="fb-body">
      <div class="fb-name">${p.name}</div>
      <div class="fb-cat" style="color:${p.hex}">${p.category}</div>
      <div class="fb-desc">${p.desc}</div>
      <div class="chips">${p.specs.slice(0, 4).map(s => `<div class="chip">${s}</div>`).join('')}</div>
    </div>`;
  fbGrid.appendChild(card);
});
const fallback = document.getElementById('fallback');
document.getElementById('btn2d').addEventListener('click', () => fallback.classList.add('show'));
document.getElementById('fb-close').addEventListener('click', () => fallback.classList.remove('show'));

// ── HOVER & CLICK ─────────────────────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
let hovered = null;

function hitProduct(e) {
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(clickables);
  return hits.length ? PRODUCTS.find(p => p.id === hits[0].object.userData.pid) : null;
}

canvas.addEventListener('mousemove', e => {
  const hit = hitProduct(e);
  canvas.style.cursor = hit ? 'pointer' : 'grab';
  if (hit) {
    hovered = hit;
    document.getElementById('tt-name').textContent = hit.name;
    document.getElementById('tt-tag').textContent = hit.category;
    tooltip.style.left = e.clientX + 'px';
    tooltip.style.top = e.clientY + 'px';
    tooltip.classList.add('show');
  } else {
    hovered = null;
    tooltip.classList.remove('show');
  }
});
canvas.addEventListener('mouseleave', () => { tooltip.classList.remove('show'); hovered = null; });
canvas.addEventListener('click', e => {
  if (animating) return;
  const hit = hitProduct(e);
  if (hit) selectProduct(hit);
});

// ── KEYBOARD ─────────────────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') deselect();
  const idx = { '1': 0, '2': 1, '3': 2 }[e.key];
  if (idx !== undefined) selectProduct(PRODUCTS[idx]);
});

// ── RESIZE ───────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  R.setSize(innerWidth, innerHeight);
});

// ── RENDER LOOP ──────────────────────────────────────────────────────────────
const clock = new THREE.Clock();

(function loop() {
  requestAnimationFrame(loop);
  const t = clock.getElapsedTime();
  controls.update();

  PRODUCTS.forEach((p, i) => {
    const isActive = activeProduct === p;
    const prog = isActive ? vidProg : 0;
    const base = t + i * 1.5;

    // Analytics: animated bars
    if (p.id === 'analytics' && p._bars) {
      p._bars.forEach((b, j) => {
        const wave = RM ? 0 : 0.12 * Math.sin(t * 1.1 + j * 0.9);
        const scale = isActive ? (0.55 + prog * 0.7 + wave) : (0.8 + wave * 0.5);
        b.mesh.scale.y = scale;
        b.mesh.position.y = b.bottom + (b.baseH * scale) / 2;
        b.mesh.material.emissiveIntensity = isActive ? 0.3 + prog * 0.8 : 0.25;
      });
      if (p._edgeLine) p._edgeLine.material.opacity = isActive ? 0.5 + 0.3 * Math.sin(t * 2) : 0.3;
    }

    // Cloud: orbiting nodes
    if (p.id === 'cloud' && p._nodes) {
      const speed = isActive ? 0.3 + prog * 1.8 : 0.3;
      const radius = isActive ? 0.52 + prog * 0.22 : 0.62;
      p._nodes.forEach(n => {
        if (!RM) n.angle += 0.008 * speed;
        n.mesh.position.x = Math.cos(n.angle) * radius;
        n.mesh.position.z = Math.sin(n.angle) * radius;
      });
      if (p._hub) {
        p._hub.material.emissiveIntensity = isActive ? 0.2 + prog * 0.9 : 0.2;
        if (!RM) p._hub.rotation.y = t * 0.5;
      }
      if (p._outerRing && !RM) p._outerRing.rotation.z = t * 0.25;
    }

    // AI: rotating octahedron
    if (p.id === 'ai' && p._oct) {
      if (!RM) {
        const rs = isActive ? 0.4 + prog * 1.4 : 0.35;
        p._oct.rotation.y = t * rs;
        p._oct.rotation.x = t * 0.18;
        p._wire.rotation.y = -t * 0.5;
        p._r1.rotation.z = t * 0.6;
        p._r2.rotation.z = -t * 0.4;
        p._r2.rotation.x = Math.sin(t * 0.3) * 0.4 - Math.PI / 3;
      }
      p._oct.material.emissiveIntensity = isActive ? 0.2 + prog * 0.9 : 0.2;
      if (p._wire) p._wire.material.opacity = isActive ? 0.35 + prog * 0.45 : 0.4;
    }

    // Hover glow on point light
    if (p._pt && !RM) {
      const targetI = isActive ? 5.5 : (hovered === p ? 4.5 : 2.5);
      p._pt.intensity += (targetI - p._pt.intensity) * 0.1;
    }
  });

  R.render(scene, camera);
})();
</script>
