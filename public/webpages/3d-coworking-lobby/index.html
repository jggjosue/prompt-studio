<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lobby 3D Coworking — Tour Guiado y Videos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo"><span class="logo-star">✦</span><span>Lobby Coworking</span></div>
      <div class="topbar-actions">
        <button id="tour-btn" class="btn btn-sm btn-outline">🚀 Iniciar tour</button>
        <button id="map-btn" class="btn btn-sm btn-outline">🗺 Zonas</button>
        <button id="transcript-btn" class="btn btn-sm btn-outline">📝 Transcripciones</button>
        <button id="analytics-btn" class="btn btn-sm btn-outline">📊</button>
      </div>
    </header>

    <div id="main">
      <div id="scene-root" role="img" aria-label="Lobby 3D de coworking con recepción y zonas"></div>

      <!-- Hotspot zones map -->
      <div id="map-panel" class="hidden panel-left" role="dialog" aria-label="Mapa de zonas">
        <div class="panel-header"><h4>🗺 Zonas</h4><button id="map-close" class="btn btn-sm btn-outline">×</button></div>
        <div id="map-body" class="map-body"></div>
      </div>

      <!-- Video overlay -->
      <div id="video-overlay" class="hidden overlay" role="dialog" aria-modal="true" aria-label="Video informativo">
        <div class="overlay-box">
          <div class="overlay-video-wrap">
            <video id="lobby-video" controls preload="metadata" playsinline></video>
          </div>
          <div id="lobby-video-info" class="video-info"></div>
          <div id="lobby-srt" class="video-srt" aria-live="polite"></div>
          <div class="overlay-actions">
            <button id="srt-download" class="btn btn-sm btn-outline">📥 Descargar SRT</button>
            <button id="video-close" class="btn btn-sm btn-outline">Cerrar</button>
          </div>
        </div>
      </div>

      <!-- Transcripts panel -->
      <div id="transcript-panel" class="hidden panel-right" role="dialog" aria-label="Transcripciones">
        <div class="panel-header"><h4>📝 Transcripciones</h4><button id="transcript-close" class="btn btn-sm btn-outline">×</button></div>
        <div id="transcript-body" class="transcript-body"></div>
      </div>

      <!-- Analytics panel -->
      <div id="analytics-panel" class="hidden panel-left" role="dialog" aria-label="Analítica">
        <div class="panel-header"><h4>📊 Actividad</h4><button id="analytics-close" class="btn btn-sm btn-outline">×</button></div>
        <div id="analytics-body" class="analytics-body"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="lobby3d.js"></script>
</body>
</html>
