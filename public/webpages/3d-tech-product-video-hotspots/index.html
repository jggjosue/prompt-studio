<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Tech Product — Video Demos & Technical Hotspots</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="scene-root"></div>

  <main class="ui">
    <header class="top glass">
      <div>
        <p class="eyebrow">Tech Product 3D</p>
        <h1>Video Demos &amp; Technical Hotspots</h1>
      </div>
      <div class="actions">
        <button id="fallback-toggle" class="btn">Fallback 2D</button>
      </div>
    </header>

    <section class="panel glass">
      <h2>Hotspots técnicos</h2>
      <div class="row" id="hotspot-buttons">
        <button class="btn hs-btn" data-hs="0">⚡ Integración API</button>
        <button class="btn hs-btn" data-hs="1">📊 Dashboard</button>
        <button class="btn hs-btn" data-hs="2">🔐 Autenticación</button>
      </div>
      <p id="hs-copy" class="copy">Haz clic en un hotspot 3D o botón para ver el video demo con snippets de código.</p>
    </section>

    <section id="fallback" class="fallback glass hidden" aria-label="2D fallback with tech demos"></section>
  </main>

  <div id="dialog" class="dialog hidden" role="dialog" aria-modal="true" aria-label="Tech demo with code snippet">
    <article class="dialog-card">
      <button id="close-dialog" class="btn close">✕</button>
      <h3 id="dialog-title"></h3>
      <div class="dialog-split">
        <div class="dialog-left">
          <video id="dialog-video" controls preload="metadata" crossorigin="anonymous">
            <track kind="captions" srclang="en" label="English" src="assets/subtitles-en.srt" default>
          </video>
        </div>
        <div class="dialog-right">
          <h4>Código</h4>
          <pre id="snippet-pre" class="snippet-pre"><code id="snippet-code" class="language-javascript"></code></pre>
          <div class="snippet-actions">
            <button id="copy-snippet" class="btn primary">📋 Copiar snippet</button>
            <a id="sandbox-link" class="btn" href="#" target="_blank" rel="noopener">🚀 Abrir sandbox</a>
          </div>
        </div>
      </div>
      <div class="dialog-meta">
        <a class="download" href="assets/transcript.txt" download>📝 Transcripción</a>
        <a class="download" href="assets/docs.pdf" download>📄 Documentación</a>
      </div>
    </article>
  </div>

  <script type="module" src="tech3d.js"></script>
</body>
</html>
