<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Light Mode Product Gallery — Video Projection & Filters</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="scene-root"></div>

  <main class="ui">
    <header class="top light-card">
      <div>
        <p class="eyebrow">Product Gallery</p>
        <h1>Light Mode 3D</h1>
      </div>
      <div class="actions">
        <button id="fallback-btn" class="btn btn-outline">Fallback 2D</button>
      </div>
    </header>

    <aside class="sidebar light-card">
      <h2>Filtros</h2>
      <div class="filter-group">
        <button class="btn filter-btn active" data-filter="all">Todos</button>
        <button class="btn filter-btn" data-filter="electronics">Electrónica</button>
        <button class="btn filter-btn" data-filter="home">Hogar</button>
        <button class="btn filter-btn" data-filter="accessories">Accesorios</button>
      </div>
      <hr class="divider">
      <p id="proximity-indicator" class="prox-indicator">🔍 Acércate a una vitrina para ver el video.</p>
    </aside>

    <section id="fallback-section" class="fallback light-card hidden" aria-label="2D fallback gallery"></section>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Product details">
    <div class="modal-card">
      <button id="close-modal" class="btn btn-close">✕</button>
      <h3 id="modal-title"></h3>
      <div class="modal-split">
        <div class="modal-left">
          <video id="modal-video" controls preload="metadata" crossorigin="anonymous">
            <track kind="captions" srclang="en" label="English" src="assets/subtitles-en.srt" default>
          </video>
        </div>
        <div class="modal-right">
          <p id="modal-desc" class="modal-desc"></p>
          <div class="modal-specs" id="modal-specs"></div>
          <div class="modal-colors" id="modal-colors"></div>
          <button id="sample-btn" class="btn btn-primary">Solicitar muestra</button>
          <a class="link-download" href="assets/transcript.txt" download>📝 Transcripción</a>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="gallery3d.js"></script>
</body>
</html>
