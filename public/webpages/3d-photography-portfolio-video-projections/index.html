<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Photography Portfolio - Video Projections</title>
  
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Hidden Video Sources for Textures -->
  <div style="display:none;">
    <video id="vid1" loop muted playsinline crossorigin="anonymous" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"></video>
    <video id="vid2" loop muted playsinline crossorigin="anonymous" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"></video>
    <video id="vid3" loop muted playsinline crossorigin="anonymous" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4"></video>
  </div>

  <div id="canvas-container"></div>

  <main class="ui-layer">
    <header class="header">
      <div class="logo">Lumina</div>
      <nav class="nav">
        <button id="btn-fallback" class="nav-btn">View Gallery (2D)</button>
        <button id="btn-about" class="nav-btn">About</button>
      </nav>
    </header>

    <div class="caption-panel" id="caption-panel">
      <div class="caption-content">
        <h2 id="clip-title" class="clip-title">Title</h2>
        <p id="clip-desc" class="clip-desc">Description goes here...</p>
        <div class="controls">
          <button id="btn-fullscreen" class="icon-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="square"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
          </button>
        </div>
      </div>
    </div>
    
    <!-- Scrubbing UI (appears when expanding) -->
    <div id="scrubber-ui" class="scrubber-ui hidden">
       <input type="range" id="video-scrub" min="0" max="100" value="0" class="scrubber">
    </div>

    <!-- 2D Fallback Gallery -->
    <div id="fallback-gallery" class="fallback-gallery hidden">
      <div class="gallery-header">
        <h1 class="gallery-title">Lumina Archive</h1>
        <button id="btn-close-gallery" class="nav-btn">Close</button>
      </div>
      <div class="grid-container">
        <!-- Grid Items injected via JS or static -->
        <div class="grid-item">
          <video controls muted src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"></video>
          <div class="grid-caption">
            <h3>Solitude</h3>
            <p>A study in light and shadow.</p>
          </div>
        </div>
        <div class="grid-item">
          <video controls muted src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"></video>
          <div class="grid-caption">
            <h3>Nature's Pulse</h3>
            <p>Vibrant energy in stillness.</p>
          </div>
        </div>
        <div class="grid-item">
          <video controls muted src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4"></video>
          <div class="grid-caption">
            <h3>Urban Echoes</h3>
            <p>Concrete geometry.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="photo3d.js"></script>
</body>
</html>
