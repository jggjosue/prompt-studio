<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev 3D — Landing Freelance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo"><span class="logo-brackets">&lt;/&gt;</span><span>Dev 3D</span></div>
      <nav class="nav-links">
        <button class="nav-btn active" data-mode="landing">Landing</button>
        <button class="nav-btn" data-mode="demo">Demo</button>
        <button class="nav-btn" data-mode="explore">Explorar</button>
      </nav>
      <div class="topbar-actions">
        <button id="analytics-btn" class="btn btn-sm btn-outline" title="Analytics">📊</button>
        <button id="fallback-btn" class="btn btn-sm btn-outline">♿</button>
      </div>
    </header>

    <div id="main">
      <div id="scene-root" role="img" aria-label="Escena 3D con maqueta interactiva de aplicación web"></div>

      <div id="hero-overlay" class="hero-overlay">
        <h1 class="hero-title">Desarrollador <span class="highlight">Full‑Stack</span></h1>
        <p class="hero-sub">Apps web 3D · APIs · UX interactivo</p>
        <button id="play-demo-btn" class="btn btn-primary btn-lg">▶ Play demo</button>
        <button id="explore-btn" class="btn btn-outline btn-lg">🔍 Explorar</button>
      </div>

      <div id="demo-panel" class="hidden">
        <div class="demo-layout">
          <div class="demo-video-wrap">
            <video id="demo-video" controls preload="metadata" crossorigin="anonymous" playsinline></video>
            <div id="demo-progress" class="demo-progress"><div id="demo-bar" class="demo-bar"></div></div>
            <div id="demo-caption" class="demo-caption"></div>
          </div>
          <div class="demo-snippets" id="demo-snippets">
            <div class="snippets-header"><h3>Código</h3><button id="snippet-copy" class="btn btn-sm btn-outline">📋 Copiar</button></div>
            <pre id="snippet-pre" class="snippet-pre"><code id="snippet-code" class="language-javascript"></code></pre>
          </div>
        </div>
        <button id="demo-close" class="btn btn-sm btn-outline demo-close">× Cerrar demo</button>
      </div>

      <div id="explore-overlay" class="hidden">
        <div class="explore-inner">
          <h3>🔍 Modo Explorar</h3>
          <p class="explore-hint">Arrastra la maqueta para inspeccionar componentes. El video se ha pausado.</p>
          <div id="explore-info" class="explore-info">Selecciona un elemento en la maqueta 3D para ver detalles.</div>
          <button id="explore-resume-btn" class="btn btn-primary">▶ Reanudar demo</button>
        </div>
      </div>

      <div id="analytics-panel" class="hidden">
        <div class="analytics-header">
          <h3>📊 Analytics</h3>
          <button id="analytics-close" class="btn btn-sm btn-outline">×</button>
        </div>
        <div id="analytics-body"></div>
      </div>
    </div>

    <div id="fallback-section" class="hidden" aria-live="polite">
      <div class="fallback-inner">
        <h2>&lt;/&gt; Versión 2D</h2>
        <div class="fb-hero"><h3>Desarrollador Full‑Stack</h3><button class="btn btn-primary">▶ Ver demo</button></div>
        <div id="fb-snippets"></div>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="dev3d.js"></script>
</body>
</html>
