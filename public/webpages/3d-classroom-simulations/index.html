<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula 3D — Lecciones y Simulaciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo">
        <span class="logo-icon">⌨</span>
        <span>Aula 3D</span>
      </div>
      <nav class="module-nav" id="module-nav">
        <button class="module-btn active" data-module="0">Péndulo</button>
        <button class="module-btn" data-module="1">Plano Inclinado</button>
        <button class="module-btn" data-module="2">Resorte</button>
      </nav>
      <div class="topbar-actions">
        <button id="save-btn" class="btn btn-sm btn-outline" title="Guardar progreso">💾</button>
        <button id="reset-btn" class="btn btn-sm btn-outline" title="Restablecer">↺</button>
        <button id="fallback-toggle" class="btn btn-sm btn-outline" title="Fallback 2D">♿</button>
      </div>
    </header>

    <div id="main">
      <div id="scene-root" role="img" aria-label="Aula virtual 3D con simulaciones de física"></div>

      <aside id="sidebar">
        <div id="lesson-panel">
          <h2 id="lesson-title">Péndulo Simple</h2>
          <p id="lesson-desc" class="desc">Estudio del movimiento armónico simple. Ajusta masa y longitud para modificar el período.</p>
          <div class="video-wrapper">
            <video id="lesson-video" preload="metadata" controls playsinline crossorigin="anonymous">
              <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4" type="video/mp4">
              <track kind="subtitles" srclang="es" label="Español" src="assets/subs-module0-es.srt">
              <track kind="subtitles" srclang="en" label="English" src="assets/subs-module0-en.srt">
            </video>
            <div id="proxy-video" style="display:none"></div>
          </div>

          <div id="timeline">
            <div id="timeline-track">
              <div id="timeline-progress"></div>
              <div class="marker" data-time="0" style="left:0%">▶</div>
              <div class="marker" data-time="5" style="left:25%">Concepto</div>
              <div class="marker" data-time="10" style="left:50%">Ecuación</div>
              <div class="marker" data-time="15" style="left:75%">Ejemplo</div>
              <div class="marker" data-time="20" style="left:100%">Ejercicio</div>
            </div>
            <div id="time-display">0:00 / 0:00</div>
          </div>

          <div id="params">
            <div class="param">
              <label>Masa <span id="mass-val">1.0</span> kg</label>
              <input type="range" id="mass-slider" min="0.5" max="3" step="0.1" value="1">
            </div>
            <div class="param">
              <label>Longitud <span id="len-val">2.0</span> m</label>
              <input type="range" id="len-slider" min="1" max="3" step="0.1" value="2">
            </div>
            <div class="param">
              <label>Fricción <span id="fric-val">0.05</span></label>
              <input type="range" id="fric-slider" min="0" max="0.5" step="0.01" value="0.05">
            </div>
            <button id="apply-btn" class="btn btn-primary">Aplicar parámetros</button>
          </div>

          <div id="sandbox" class="hidden">
            <h3>🧪 Ejercicio</h3>
            <p id="exercise-text" class="desc">Ajusta los parámetros para que el período sea exactamente 2.0 s.</p>
            <div class="sandbox-feedback" id="sandbox-feedback"></div>
            <button id="solve-btn" class="btn btn-sm btn-outline">Ver solución</button>
          </div>

          <div id="transcript-box">
            <details>
              <summary>📄 Transcripción</summary>
              <div id="transcript-content" class="transcript-body"></div>
            </details>
          </div>
        </div>
      </aside>
    </div>

    <div id="fallback-section" class="hidden" aria-live="polite">
      <div class="fallback-inner">
        <h2>🎓 Aula 3D — Versión 2D</h2>
        <div class="fb-grid" id="fb-grid"></div>
      </div>
    </div>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <button id="modal-close" class="modal-close" aria-label="Cerrar">&times;</button>
        <video id="modal-video" controls preload="metadata" crossorigin="anonymous"></video>
        <div id="modal-body"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="classroom3d.js"></script>
</body>
</html>
