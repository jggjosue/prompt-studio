<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio 3D — Arquitectura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo"><span class="logo-icon">◈</span><span>Arq 3D</span></div>
      <nav class="project-nav" id="project-nav">
        <button class="project-btn active" data-project="0">Museo</button>
        <button class="project-btn" data-project="1">Torre</button>
        <button class="project-btn" data-project="2">Casa</button>
      </nav>
      <div class="topbar-actions">
        <button id="layers-btn" class="btn btn-sm btn-outline" title="Capas">🧱</button>
        <button id="free-btn" class="btn btn-sm btn-outline" title="Modo libre WASD">🎮</button>
        <button id="fallback-btn" class="btn btn-sm btn-outline">♿</button>
      </div>
    </header>

    <div id="main">
      <div id="scene-root" role="img" aria-label="Portfolio 3D de arquitectura"></div>

      <div id="hud-buttons" class="hud-buttons">
        <button id="walkthrough-btn" class="btn walkthrough-btn">🎬 Iniciar Walkthrough</button>
      </div>

      <div id="layers-panel" class="hidden">
        <h3>🧱 Capas</h3>
        <label><input type="checkbox" data-layer="structure" checked> Estructura</label>
        <label><input type="checkbox" data-layer="finishes" checked> Acabados</label>
        <label><input type="checkbox" data-layer="furniture" checked> Mobiliario</label>
      </div>

      <div id="slider-panel" class="hidden">
        <h3>Antes / Después</h3>
        <input type="range" id="before-after-slider" min="0" max="1" step="0.01" value="0.5">
        <div class="slider-labels"><span>Render</span><span>Foto real</span></div>
      </div>

      <div id="video-panel" class="hidden">
        <button id="video-close" class="panel-close">&times;</button>
        <div class="video-panel-inner">
          <h3 id="video-title" class="video-title"></h3>
          <div class="video-wrapper">
            <video id="project-video" controls preload="metadata" crossorigin="anonymous"></video>
          </div>
          <p id="video-desc" class="video-desc"></p>
          <div id="video-hotspots" class="video-hotspots"></div>
          <a id="pdf-link" class="pdf-link" target="_blank" rel="noopener" style="display:none">📄 Descargar plano PDF</a>
        </div>
      </div>
    </div>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <button id="modal-close" class="modal-close">&times;</button>
        <video id="modal-video" controls preload="metadata" crossorigin="anonymous"></video>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>

    <div id="fallback-section" class="hidden" aria-live="polite">
      <div class="fallback-inner">
        <h2>🏗️ Portfolio — Versión 2D</h2>
        <div id="fb-grid" class="fb-grid"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="arch3d.js"></script>
</body>
</html>
