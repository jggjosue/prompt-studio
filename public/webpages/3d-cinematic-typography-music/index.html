<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Cinematic Typography Show — Music & Video Control</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <video id="bg-video" preload="metadata" playsinline crossorigin="anonymous" loop>
    <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" type="video/mp4">
  </video>

  <div id="scene-root"></div>

  <main class="ui">
    <header class="top glass">
      <div>
        <p class="eyebrow">Typography Show 3D</p>
        <h1>Cinematic &amp; Music Reactive</h1>
      </div>
      <div class="actions">
        <button id="play-toggle" class="btn primary">Play</button>
        <button id="export-frame" class="btn">📷 Exportar frame</button>
        <button id="fallback-toggle" class="btn">Fallback 2D</button>
      </div>
    </header>

    <section class="panel glass">
      <h2>Controles</h2>
      <div class="control-group">
        <label class="ctl-label">Mood</label>
        <div class="row">
          <button class="btn mood-btn active" data-mood="calm">Calm</button>
          <button class="btn mood-btn" data-mood="energetic">Energetic</button>
        </div>
      </div>
      <div class="control-group">
        <label class="ctl-label">Stem de audio</label>
        <div class="row">
          <button class="btn stem-btn active" data-stem="0">Full mix</button>
          <button class="btn stem-btn" data-stem="1">Drums</button>
          <button class="btn stem-btn" data-stem="2">Melody</button>
          <button class="btn stem-btn" data-stem="3">Bass</button>
        </div>
      </div>
      <div class="control-group">
        <label class="ctl-label">Timeline</label>
        <input id="scrubber" type="range" min="0" max="100" value="0" step="0.1" aria-label="Scrub video">
      </div>
      <p id="freq-indicator" class="freq-indicator">🎵 Frecuencia: — | Amplitud: —</p>
    </section>

    <section id="fallback" class="fallback glass hidden" aria-label="2D fallback with typography show"></section>
  </main>

  <script type="module" src="typeShow.js"></script>
</body>
</html>
