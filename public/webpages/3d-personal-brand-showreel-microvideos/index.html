<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Personal Brand Showreel</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="video-bank" aria-hidden="true">
    <video id="face-video-1" muted loop playsinline preload="metadata" crossorigin="anonymous" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"></video>
    <video id="face-video-2" muted loop playsinline preload="metadata" crossorigin="anonymous" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"></video>
    <video id="face-video-3" muted loop playsinline preload="metadata" crossorigin="anonymous" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4"></video>
    <video id="face-video-4" muted loop playsinline preload="metadata" crossorigin="anonymous" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4"></video>
    <video id="face-video-5" muted loop playsinline preload="metadata" crossorigin="anonymous" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4"></video>
    <video id="face-video-6" muted loop playsinline preload="metadata" crossorigin="anonymous" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4"></video>
  </div>

  <div id="scene"></div>

  <main class="ui">
    <header class="top glass">
      <div>
        <p class="eyebrow">Personal Brand Sphere</p>
        <h1>Monochrome Showreel Cube</h1>
      </div>
      <button id="toggle-fallback" class="btn">Linear Fallback</button>
    </header>

    <section class="info glass">
      <h2 id="face-title">Rotate the cube</h2>
      <p id="face-desc">Swipe or drag to explore each face. Click a face to open fullscreen with subtitles.</p>
    </section>

    <section id="fallback" class="fallback glass hidden" aria-label="Accessible linear video list"></section>
  </main>

  <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Fullscreen microvideo">
    <div class="overlay-card">
      <button id="close-overlay" class="btn close">Close</button>
      <h3 id="overlay-title"></h3>
      <video id="overlay-video" controls preload="metadata" crossorigin="anonymous">
        <track id="overlay-track" kind="captions" srclang="en" label="English" src="assets/subtitles-en.vtt" default>
      </video>
      <p id="overlay-caption"></p>
    </div>
  </div>

  <script type="module" src="personal3d.js"></script>
</body>
</html>
