<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudio 3D — Videógrafo Freelance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo"><span class="logo-icon">◈</span><span>Estudio 3D</span></div>
      <div class="topbar-actions">
        <button id="director-btn" class="btn btn-sm btn-outline" title="Modo director">🎬 Director</button>
        <button id="session-btn" class="btn btn-sm btn-outline" title="Session replay">🎞 Session</button>
        <button id="analytics-btn" class="btn btn-sm btn-outline" title="Analytics">📊</button>
        <button id="fallback-btn" class="btn btn-sm btn-outline">♿</button>
      </div>
    </header>

    <div id="main">
      <div id="scene-root" role="img" aria-label="Estudio 3D con monitores flotantes en pared curva"></div>

      <div id="timeline-bar" class="timeline-bar">
        <div class="timeline-track" id="timeline-track">
          <div class="timeline-thumb" id="timeline-thumb"></div>
        </div>
        <div class="timeline-labels" id="timeline-labels"></div>
      </div>

      <div id="monitor-panel" class="hidden">
        <button id="panel-close" class="panel-close">&times;</button>
        <div class="panel-inner">
          <h3 id="panel-title" class="panel-title"></h3>
          <div class="video-wrapper">
            <video id="panel-video" controls preload="metadata" crossorigin="anonymous"></video>
          </div>
          <div id="panel-subs" class="panel-subs"></div>
        </div>
      </div>

      <div id="director-panel" class="hidden">
        <div class="director-header">
          <h3>🎬 Director</h3>
          <button id="director-close" class="btn btn-sm btn-outline">×</button>
        </div>
        <div id="director-body" class="director-body"></div>
      </div>

      <div id="session-panel" class="hidden">
        <div class="session-header">
          <h3>🎞 Session Replay</h3>
          <button id="session-export" class="btn btn-sm btn-outline">📄 JSON</button>
          <button id="session-close" class="btn btn-sm btn-outline">×</button>
        </div>
        <div class="session-clips" id="session-clips"></div>
        <div class="session-preview" id="session-preview"></div>
      </div>

      <div id="analytics-panel" class="hidden">
        <div class="analytics-header">
          <h3>📊 Analytics</h3>
          <button id="analytics-close" class="btn btn-sm btn-outline">×</button>
        </div>
        <div id="analytics-body" class="analytics-body"></div>
      </div>
    </div>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <button id="modal-close" class="modal-close">&times;</button>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>

    <div id="fallback-section" class="hidden" aria-live="polite">
      <div class="fallback-inner"><h2>🎥 Estudio — Versión 2D</h2><div id="fb-grid" class="fb-grid"></div></div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="studio.js"></script>
</body>
</html>
