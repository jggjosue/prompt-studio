<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evento Híbrido 3D — Streaming Sincronizado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo"><span class="logo-star">✦</span><span>Hybrid Event</span></div>
      <div class="topbar-actions">
        <button id="cam-btn" class="btn btn-sm btn-outline">🎥 Cámaras</button>
        <button id="clips-btn" class="btn btn-sm btn-outline">🎬 Clips</button>
        <button id="polls-btn" class="btn btn-sm btn-outline">📊 Encuestas</button>
        <button id="qa-btn" class="btn btn-sm btn-outline">💬 Q&A</button>
        <button id="metrics-btn" class="btn btn-sm btn-outline">📊</button>
        <button id="access-btn" class="btn btn-sm btn-outline">♿</button>
        <span id="sync-status" class="sync-status">⏳ Sincronizando…</span>
      </div>
    </header>

    <div id="main">
      <div id="scene-root" role="img" aria-label="Réplica 3D del venue con pantallas virtuales"></div>

      <!-- Camera selector -->
      <div id="cam-panel" class="hidden panel-left" role="dialog" aria-label="Selector de cámaras">
        <div class="panel-header"><h4>🎥 Cámaras</h4><button id="cam-close" class="btn btn-sm btn-outline">×</button></div>
        <div id="cam-body" class="cam-body"></div>
      </div>

      <!-- Clips gallery -->
      <div id="clips-panel" class="hidden panel-right" role="dialog" aria-label="Galería de clips">
        <div class="panel-header"><h4>🎬 Clips sincronizados</h4><button id="clips-close" class="btn btn-sm btn-outline">×</button></div>
        <div id="clips-body" class="clips-body"></div>
      </div>

      <!-- Polls overlay -->
      <div id="polls-overlay" class="hidden overlay" role="dialog" aria-label="Encuesta en vivo">
        <div class="overlay-box" style="max-width:360px">
          <h3>📊 Encuesta en vivo</h3>
          <p id="poll-question" class="poll-question"></p>
          <div id="poll-options" class="poll-options"></div>
          <button id="poll-vote" class="btn btn-primary" style="width:100%;margin-top:.3rem">Votar</button>
          <button id="poll-close-overlay" class="btn btn-sm btn-outline" style="width:100%;margin-top:.15rem">Cerrar</button>
        </div>
      </div>

      <!-- Q&A panel -->
      <div id="qa-panel" class="hidden panel-right" role="dialog" aria-label="Preguntas en vivo">
        <div class="panel-header"><h4>💬 Preguntas</h4><button id="qa-close" class="btn btn-sm btn-outline">×</button></div>
        <div id="qa-body" class="qa-body">
          <div id="qa-list" class="qa-list"></div>
          <textarea id="qa-input" placeholder="Escribe tu pregunta…" aria-label="Tu pregunta"></textarea>
          <button id="qa-send" class="btn btn-primary" style="width:100%;margin-top:.15rem">Enviar</button>
        </div>
      </div>

      <!-- Metrics panel -->
      <div id="metrics-panel" class="hidden panel-left" role="dialog" aria-label="Métricas">
        <div class="panel-header"><h4>📊 Métricas</h4><button id="metrics-close" class="btn btn-sm btn-outline">×</button></div>
        <div id="metrics-body" class="metrics-body"></div>
      </div>

      <!-- 2D fallback -->
      <div id="fallback-section" class="hidden fallback-section">
        <div class="fallback-inner">
          <h3>✦ Versión 2D</h3>
          <video id="fb-video" controls preload="metadata" playsinline style="width:100%;border-radius:6px"></video>
          <div id="fb-clips" class="fb-clips"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="hybrid3d.js"></script>
</body>
</html>
