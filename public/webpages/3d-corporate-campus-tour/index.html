<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Corporate Campus Tour</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="scene-root"></div>

  <main class="ui">
    <header class="top glass">
      <div>
        <p class="eyebrow">Corporate Campus Experience</p>
        <h1>Elegant 3D Guided Tour</h1>
      </div>
      <div class="actions">
        <button id="start-tour" class="btn primary">Iniciar tour</button>
        <button id="toggle-fallback" class="btn">Fallback 2D</button>
      </div>
    </header>

    <section class="panel glass">
      <h2>Quick Views</h2>
      <div class="row">
        <button class="btn view-btn" data-view="lobby">1 Lobby</button>
        <button class="btn view-btn" data-view="auditorium">2 Auditorio</button>
        <button class="btn view-btn" data-view="terrace">3 Terraza</button>
      </div>
      <p id="zone-copy" class="copy">Select a hotspot to open an explanatory clip with subtitles and metrics.</p>
      <p id="metrics" class="metrics">Capacidad - | Proyectos - | Años -</p>
    </section>

    <section id="fallback" class="fallback glass hidden" aria-label="2D fallback with chapters and transcript"></section>
  </main>

  <div id="dialog" class="dialog hidden" role="dialog" aria-modal="true" aria-label="Explanatory video panel">
    <article class="dialog-card">
      <button id="close-dialog" class="btn close">Close</button>
      <h3 id="dialog-title"></h3>
      <video id="dialog-video" controls preload="metadata" crossorigin="anonymous">
        <track kind="captions" srclang="en" label="English" src="assets/subtitles-en.srt" default>
      </video>
      <p id="subtitle" class="subtitle">Subtitles enabled.</p>
      <a class="download" href="assets/transcript.txt" download>Download transcript</a>
    </article>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
