name: Documentation Reach

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Informational while Swimm establishes a meaningful baseline; never blocks a merge.
permissions:
  contents: read
  pull-requests: read

jobs:
  report:
    name: Documentation Reach (informational)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: Measure documentation reach
        id: measure
        run: |
          if [ -f scripts/mjs/measure-documentation-reach.mjs ]; then
            node scripts/mjs/measure-documentation-reach.mjs --json > measured.json
          else
            echo '{"note":"metric script not available in this branch yet"}' > measured.json
          fi

      - name: Report documentation coupling and reach
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const names = files.map(file => file.filename);
            const code = names.filter(name => name.startsWith('src/') && !name.startsWith('src/data/'));
            const docs = names.filter(name =>
              name.startsWith('docs/') ||
              name === 'README.md' ||
              name === 'CONTRIBUTING.md' ||
              name === '.swmignore'
            );

            const measured = JSON.parse(fs.readFileSync('measured.json', 'utf8'));
            const metricAvailable = typeof measured.documentedFiles === 'number';
            const baselinePath = 'docs/reports/documentation-reach-baseline.json';
            const baseline = fs.existsSync(baselinePath)
              ? JSON.parse(fs.readFileSync(baselinePath, 'utf8'))
              : null;

            const deltaPp = metricAvailable && baseline ? measured.percentage - baseline.percentage : null;
            const deltaFiles = metricAvailable && baseline ? measured.documentedFiles - baseline.documentedFiles : null;
            const regression = metricAvailable && baseline && (
              deltaPp < -1.0 ||
              deltaFiles < -5
            );
            const arrow = !metricAvailable ? '—'
              : deltaPp === null ? '—'
              : deltaPp > 0.05 ? `▲ +${deltaPp.toFixed(2)} pp`
              : deltaPp < -0.05 ? `▼ ${deltaPp.toFixed(2)} pp`
              : '◀ sin cambio';

            const rows = [
              [{ data: 'Documented files', header: true }, metricAvailable ? `${measured.documentedFiles} / ${measured.totalFiles}` : 'script no disponible en esta rama'],
              [{ data: 'Documented lines', header: true }, metricAvailable ? `${measured.documentedLines} / ${measured.totalSourceLines}` : '—'],
              [{ data: 'Reach', header: true }, metricAvailable ? `${measured.percentage}% (Tier ${measured.tier})` : '—'],
              [{ data: 'Vs baseline', header: true }, !metricAvailable ? '—' : baseline ? `${arrow} (baseline ${baseline.percentage}%)` : 'no hay fichero baseline'],
              [{ data: 'Source files in reach scope changed', header: true }, String(code.length)],
              [{ data: 'Documentation or reach-configuration files', header: true }, String(docs.length)],
              [{ data: 'Swimm status', header: true }, 'Informational — target after baseline: Tier B (≥40%)'],
            ];

            const summary = core.summary
              .addHeading('Documentation Reach', 2)
              .addRaw('Metrica local (`npm run docs:reach`) y acoplamiento de documentos. No bloquea este pull request; Swimm sigue siendo la medición de referencia.')
              .addTable(rows);

            if (metricAvailable && baseline && regression) {
              summary.addRaw(`⚠️ Documented files or reach dropped vs baseline (${baseline.capturedAt}). Review the Documentation Reach checklist in the PR template before merging.`);
            }

            await summary.write();

            if (code.length && !docs.length) {
              core.notice('Source files changed without documentation or reach-configuration changes. Review the Documentation Reach section of the PR template.');
            } else if (code.length && docs.length) {
              core.notice('Source and documentation changes were detected together. Confirm the changed source is covered by the linked documentation.');
            } else {
              core.notice('No source changes in Documentation Reach scope were detected.');
            }
            if (baseline && regression) {
              core.notice('Documentation Reach regression vs baseline; the PR template checklist applies.');
            }